<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        .test-button:hover {
            background: #0056b3;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            background: #2a2a2a;
        }
        .error {
            border-color: #dc3545;
            background: #3a1a1a;
        }
        .success {
            border-color: #28a745;
            background: #1a3a1a;
        }
    </style>
</head>
<body>
    <h1>Capture API Test</h1>
    <p>This page tests the capture functionality integration.</p>
    
    <div>
        <button class="test-button" onclick="testScreenshot()">Test Screenshot</button>
        <button class="test-button" onclick="testVideoRecording()">Test Video Recording</button>
        <button class="test-button" onclick="testAudioRecording()">Test Audio Recording</button>
        <button class="test-button" onclick="testAPI()">Test API Availability</button>
    </div>
    
    <div id="results"></div>
    
    <script src="capture/renderer/capture-renderer.js"></script>
    <script>
        // Initialize renderer capture API
        let rendererCaptureAPI = null;
        if (window.RendererCaptureAPI) {
            rendererCaptureAPI = new window.RendererCaptureAPI();
            console.log('Renderer capture API initialized');
        }
        
        function addResult(text, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${text}`;
            results.insertBefore(div, results.firstChild);
        }
        
        async function testScreenshot() {
            try {
                addResult('Testing screenshot...', 'info');
                
                if (window.CaptureAPI && window.CaptureAPI.quickScreenshot) {
                    const result = await window.CaptureAPI.quickScreenshot();
                    if (result.success) {
                        addResult('Screenshot captured successfully!', 'success');
                    } else {
                        addResult(`Screenshot failed: ${result.error}`, 'error');
                    }
                } else {
                    addResult('CaptureAPI.quickScreenshot not available', 'error');
                }
            } catch (error) {
                addResult(`Screenshot error: ${error.message}`, 'error');
            }
        }
        
        async function testVideoRecording() {
            try {
                addResult('Testing video recording...', 'info');
                
                if (rendererCaptureAPI) {
                    // Start recording
                    const startResult = await rendererCaptureAPI.startScreenRecording({
                        quality: 'medium'
                    });
                    
                    if (startResult.success) {
                        addResult(`Video recording started (ID: ${startResult.recordingId})`, 'success');
                        
                        // Stop after 3 seconds
                        setTimeout(async () => {
                            const stopResult = await rendererCaptureAPI.stopRecording(startResult.recordingId);
                            if (stopResult.success) {
                                addResult('Video recording stopped successfully!', 'success');
                            } else {
                                addResult(`Video recording stop failed: ${stopResult.error}`, 'error');
                            }
                        }, 3000);
                    } else {
                        addResult(`Video recording failed: ${startResult.error}`, 'error');
                    }
                } else {
                    addResult('RendererCaptureAPI not available', 'error');
                }
            } catch (error) {
                addResult(`Video recording error: ${error.message}`, 'error');
            }
        }
        
        async function testAudioRecording() {
            try {
                addResult('Testing audio recording...', 'info');
                
                if (rendererCaptureAPI) {
                    // Start recording
                    const startResult = await rendererCaptureAPI.startAudioRecording({
                        echoCancellation: true
                    });
                    
                    if (startResult.success) {
                        addResult(`Audio recording started (ID: ${startResult.recordingId})`, 'success');
                        
                        // Stop after 3 seconds
                        setTimeout(async () => {
                            const stopResult = await rendererCaptureAPI.stopRecording(startResult.recordingId);
                            if (stopResult.success) {
                                addResult('Audio recording stopped successfully!', 'success');
                            } else {
                                addResult(`Audio recording stop failed: ${stopResult.error}`, 'error');
                            }
                        }, 3000);
                    } else {
                        addResult(`Audio recording failed: ${startResult.error}`, 'error');
                    }
                } else {
                    addResult('RendererCaptureAPI not available', 'error');
                }
            } catch (error) {
                addResult(`Audio recording error: ${error.message}`, 'error');
            }
        }
        
        function testAPI() {
            addResult('Testing API availability...', 'info');
            
            const apis = [
                'window.CaptureAPI',
                'window.RendererCaptureAPI',
                'window.MediaUtils',
                'navigator.mediaDevices',
                'MediaRecorder'
            ];
            
            apis.forEach(api => {
                const available = eval(`typeof ${api} !== 'undefined'`);
                addResult(`${api}: ${available ? 'Available' : 'Not Available'}`, available ? 'success' : 'error');
            });
            
            if (rendererCaptureAPI) {
                const support = rendererCaptureAPI.checkSupport();
                Object.entries(support).forEach(([feature, supported]) => {
                    addResult(`${feature}: ${supported ? 'Supported' : 'Not Supported'}`, supported ? 'success' : 'error');
                });
            }
        }
        
        // Test API availability on load
        window.addEventListener('load', () => {
            setTimeout(testAPI, 1000);
        });
    </script>
</body>
</html>
