<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual AI Audio Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: #1e1e1f;
            color: #f5f5f5;
            max-width: 800px;
            margin: 0 auto;
        }

        .test-section {
            background: #2a2a2b;
            border: 1px solid #333436;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .test-section h2 {
            color: #3b82f6;
            margin-top: 0;
            border-bottom: 1px solid #333436;
            padding-bottom: 10px;
        }

        .ai-provider-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .ai-provider-btn {
            padding: 10px 20px;
            border: 1px solid #333436;
            border-radius: 8px;
            background: #2a2a2b;
            color: #f5f5f5;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ai-provider-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
        }

        .ai-provider-btn:hover {
            background: #2563eb;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #2563eb;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .status {
            background: #333;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .audio-preview {
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            background: #333;
            margin: 10px 0;
        }

        .audio-preview audio {
            width: 100%;
            border-radius: 4px;
        }

        .result-display {
            background: #333;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .provider-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .provider-item {
            padding: 10px;
            border: 1px solid #444;
            border-radius: 6px;
            text-align: center;
        }

        .provider-item.available {
            background: rgba(34, 197, 94, 0.1);
            border-color: #22c55e;
        }

        .provider-item.unavailable {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
        }
    </style>
</head>
<body>
    <h1>🎤 Dual AI Audio Test Suite</h1>
    
    <!-- AI Provider Selection -->
    <div class="test-section">
        <h2>🤖 AI Provider Selection</h2>
        <div class="ai-provider-selector">
            <button class="ai-provider-btn active" id="geminiBtn" data-provider="gemini">Gemini AI</button>
            <button class="ai-provider-btn" id="assemblyaiBtn" data-provider="assemblyai">AssemblyAI</button>
        </div>
        <div id="providerStatus" class="status">Select an AI provider above</div>
    </div>

    <!-- Audio Recording Test -->
    <div class="test-section">
        <h2>🎙️ Audio Recording Test</h2>
        <div class="button-group">
            <button onclick="testAudioRecording()">Start Audio Recording</button>
            <button onclick="testStopRecording()" disabled id="stopRecordingBtn">Stop Recording</button>
            <button onclick="testAudioUpload()">Upload Audio File</button>
        </div>
        <div id="recordingStatus" class="status">Ready to record audio</div>
        <div id="audioPreview" class="audio-preview" style="display: none;">
            <h4>Recorded Audio:</h4>
            <audio id="audioPlayer" controls></audio>
        </div>
    </div>

    <!-- AI Processing Test -->
    <div class="test-section">
        <h2>🧠 AI Processing Test</h2>
        <div class="button-group">
            <button onclick="testAIProcessing()" disabled id="processBtn">Process Audio with AI</button>
            <button onclick="clearResults()">Clear Results</button>
        </div>
        <div id="processingStatus" class="status">Record or upload audio first</div>
        <div id="aiResults" class="result-display" style="display: none;"></div>
    </div>

    <!-- Service Status -->
    <div class="test-section">
        <h2>📊 Service Status</h2>
        <button onclick="checkServiceStatus()">Check Service Status</button>
        <div id="serviceStatus" class="status">Click to check service status</div>
        <div id="serviceInfo" class="provider-info"></div>
    </div>

    <script>
        // Global state
        let currentAIProvider = 'gemini';
        let currentAudioBlob = null;
        let currentAudioRecordingId = null;
        let isRecording = false;

        // DOM elements
        const geminiBtn = document.getElementById('geminiBtn');
        const assemblyaiBtn = document.getElementById('assemblyaiBtn');
        const stopRecordingBtn = document.getElementById('stopRecordingBtn');
        const processBtn = document.getElementById('processBtn');
        const audioPreview = document.getElementById('audioPreview');
        const audioPlayer = document.getElementById('audioPlayer');
        const aiResults = document.getElementById('aiResults');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeAIProviderSelection();
            checkServiceStatus();
        });

        // AI Provider Selection
        function initializeAIProviderSelection() {
            geminiBtn.addEventListener('click', () => setAIProvider('gemini'));
            assemblyaiBtn.addEventListener('click', () => setAIProvider('assemblyai'));
        }

        function setAIProvider(provider) {
            currentAIProvider = provider;
            
            // Update button states
            geminiBtn.classList.toggle('active', provider === 'gemini');
            assemblyaiBtn.classList.toggle('provider', provider === 'assemblyai');
            
            // Update status
            log('providerStatus', `AI Provider switched to: ${provider.toUpperCase()}`, 'info');
            
            // Show feedback
            showProviderFeedback(provider);
        }

        function showProviderFeedback(provider) {
            const feedback = document.createElement('div');
            feedback.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #3b82f6;
                color: white;
                padding: 10px 16px;
                border-radius: 8px;
                font-weight: 500;
                z-index: 10000;
                animation: slideInRight 0.3s ease;
            `;
            feedback.textContent = `Switched to ${provider === 'gemini' ? 'Gemini AI' : 'AssemblyAI'}`;
            
            document.body.appendChild(feedback);
            
            setTimeout(() => {
                if (document.body.contains(feedback)) {
                    feedback.style.animation = 'slideOutRight 0.3s ease';
                    setTimeout(() => {
                        if (document.body.contains(feedback)) {
                            document.body.removeChild(feedback);
                        }
                    }, 300);
                }
            }, 2000);
        }

        // Audio Recording Test
        async function testAudioRecording() {
            try {
                log('recordingStatus', 'Starting audio recording...', 'info');
                
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('Audio recording not supported in this browser');
                }

                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        chunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    currentAudioBlob = blob;
                    
                    // Create audio preview
                    const audioUrl = URL.createObjectURL(blob);
                    audioPlayer.src = audioUrl;
                    audioPreview.style.display = 'block';
                    
                    // Enable processing button
                    processBtn.disabled = false;
                    
                    log('recordingStatus', `Audio recording completed. Size: ${formatFileSize(blob.size)}`, 'success');
                    
                    // Stop all tracks
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                stopRecordingBtn.disabled = false;
                
                log('recordingStatus', 'Audio recording started. Click "Stop Recording" when done.', 'success');

            } catch (error) {
                log('recordingStatus', `Audio recording failed: ${error.message}`, 'error');
            }
        }

        function testStopRecording() {
            if (isRecording) {
                // This would stop the MediaRecorder
                // For now, we'll simulate it
                isRecording = false;
                stopRecordingBtn.disabled = true;
                
                log('recordingStatus', 'Recording stopped manually', 'info');
            }
        }

        async function testAudioUpload() {
            try {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'audio/*';
                
                input.onchange = (event) => {
                    const file = event.target.files[0];
                    if (file) {
                        currentAudioBlob = file;
                        
                        // Create audio preview
                        const audioUrl = URL.createObjectURL(file);
                        audioPlayer.src = audioUrl;
                        audioPreview.style.display = 'block';
                        
                        // Enable processing button
                        processBtn.disabled = false;
                        
                        log('recordingStatus', `Audio file uploaded: ${file.name} (${formatFileSize(file.size)})`, 'success');
                    }
                };
                
                input.click();
                
            } catch (error) {
                log('recordingStatus', `Audio upload failed: ${error.message}`, 'error');
            }
        }

        // AI Processing Test
        async function testAIProcessing() {
            if (!currentAudioBlob) {
                log('processingStatus', 'No audio available for processing', 'error');
                return;
            }

            try {
                log('processingStatus', `Processing audio with ${currentAIProvider.toUpperCase()}...`, 'info');
                
                // Show processing indicator
                showProcessingIndicator();
                
                // Simulate AI processing
                const result = await simulateAIProcessing(currentAudioBlob);
                
                // Hide processing indicator
                hideProcessingIndicator();
                
                // Display results
                displayAIResults(result);
                
                log('processingStatus', 'AI processing completed successfully', 'success');
                
            } catch (error) {
                hideProcessingIndicator();
                log('processingStatus', `AI processing failed: ${error.message}`, 'error');
            }
        }

        async function simulateAIProcessing(audioBlob) {
            // Simulate API delay based on provider
            const delay = currentAIProvider === 'gemini' ? 3000 : 2000;
            await new Promise(resolve => setTimeout(resolve, delay));
            
            if (currentAIProvider === 'assemblyai') {
                return {
                    success: true,
                    content: `[AssemblyAI Transcription] This is a simulated transcription of the audio file. In a real implementation, this would contain the actual transcribed text from AssemblyAI's speech-to-text service.`,
                    provider: 'assemblyai',
                    metadata: {
                        confidence: 0.95,
                        language: 'en',
                        duration: 5.2,
                        model: 'AssemblyAI Transcription'
                    }
                };
            } else {
                return {
                    success: true,
                    content: `[Gemini AI Response] I've analyzed the audio file. This is a simulated response from Gemini AI. In a real implementation, this would contain the actual AI-generated response based on the audio content.`,
                    provider: 'gemini',
                    metadata: {
                        model: 'Gemini 2.5 Flash'
                    }
                };
            }
        }

        function displayAIResults(result) {
            aiResults.style.display = 'block';
            aiResults.innerHTML = `
AI Processing Results:
=====================
Provider: ${result.provider.toUpperCase()}
Status: ${result.success ? 'Success' : 'Failed'}
${result.metadata ? `
Metadata:
- Confidence: ${result.metadata.confidence || 'N/A'}
- Language: ${result.metadata.language || 'N/A'}
- Duration: ${result.metadata.duration || 'N/A'}
- Model: ${result.metadata.model || 'N/A'}
` : ''}

Content:
${result.content}
            `;
        }

        function clearResults() {
            aiResults.style.display = 'none';
            aiResults.innerHTML = '';
            log('processingStatus', 'Results cleared', 'info');
        }

        // Service Status
        async function checkServiceStatus() {
            log('serviceStatus', 'Checking service status...', 'info');
            
            // Simulate service status check
            const status = {
                gemini: { configured: true, status: 'Available' },
                assemblyai: { configured: false, status: 'Not Configured', reason: 'API key missing' }
            };
            
            displayServiceStatus(status);
            log('serviceStatus', 'Service status check completed', 'success');
        }

        function displayServiceStatus(status) {
            const serviceInfo = document.getElementById('serviceInfo');
            serviceInfo.innerHTML = '';
            
            Object.entries(status).forEach(([provider, info]) => {
                const div = document.createElement('div');
                div.className = `provider-item ${info.configured ? 'available' : 'unavailable'}`;
                div.innerHTML = `
                    <strong>${provider.toUpperCase()}</strong><br>
                    Status: ${info.status}<br>
                    ${info.reason ? `Reason: ${info.reason}` : ''}
                `;
                serviceInfo.appendChild(div);
            });
        }

        // Utility Functions
        function showProcessingIndicator() {
            const indicator = document.createElement('div');
            indicator.id = 'processingIndicator';
            indicator.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: #2a2a2b;
                border: 1px solid #333436;
                border-radius: 12px;
                padding: 20px;
                text-align: center;
                z-index: 10000;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            `;
            
            indicator.innerHTML = `
                <div style="margin-bottom: 16px;">
                    <div style="width: 24px; height: 24px; border: 2px solid #3b82f6; border-top: 2px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
                </div>
                <div style="font-weight: 500; margin-bottom: 8px;">Processing Audio</div>
                <div style="font-size: 12px; color: #9ca3af;">
                    Using ${currentAIProvider.toUpperCase()}...
                </div>
            `;
            
            document.body.appendChild(indicator);
        }

        function hideProcessingIndicator() {
            const indicator = document.getElementById('processingIndicator');
            if (indicator && document.body.contains(indicator)) {
                document.body.removeChild(indicator);
            }
        }

        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ef4444' : type === 'success' ? '#22c55e' : '#f5f5f5';
            element.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            element.scrollTop = element.scrollHeight;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // CSS Animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideInRight {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOutRight {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
