<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Input</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="chat-input-container">
        <div class="prompt-input" role="form" aria-label="Chat input">
            <div class="drag-handle" title="Drag to move window"></div>
            <div class="prompt-content">
                <div class="input-area">
                    <textarea id="messageInput" placeholder="Ask anything" rows="1" autocomplete="off"
                        spellcheck="false" aria-label="Message input"></textarea>
                </div>

                <div class="prompt-actions">
                    <div class="left-actions">
                        <button class="action-btn icon-only" id="addButton" aria-label="Add attachment"
                            title="Add attachment">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 5v14M5 12h14" />
                            </svg>
                        </button>

                        <!-- Transparency/Lighting Effect Button -->
                        <button class="action-btn icon-only lighting" id="lightingButton"
                            aria-label="Toggle transparency" title="Toggle lighting effect">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="13,2 3,14 12,14 11,22 21,10 12,10 13,2" />
                            </svg>
                        </button>

                        <!-- Hide/Show Window Button -->
                        <button class="action-btn icon-only" id="hideShowButton"
                            aria-label="Hide window" title="Hide window (Ctrl+H)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18l-2-2H5l-2 2z"/>
                                <path d="M21 6v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6"/>
                                <path d="m8 10 4 4 4-4"/>
                            </svg>
                        </button>

                        <!-- Toggle Main Window Button -->
                        <button class="action-btn icon-only" id="toggleMainWindowButton"
                            aria-label="Toggle main window" title="Toggle main window visibility (Ctrl+M)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <path d="M9 9h.01"/>
                                <path d="M15 9h.01"/>
                                <path d="M9 15h.01"/>
                                <path d="M15 15h.01"/>
                            </svg>
                        </button>
                    </div>

                    <div class="draggable-area" title="Drag to move window"></div>

                    <div class="right-actions">
                        <button class="action-btn icon-only primary" id="sendButton" aria-label="Send message"
                            title="Send (Enter)">
                            <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m5 12 7-7 7 7" />
                                <path d="m12 19 0-14" />
                            </svg>
                            <div id="loadingSpinner" class="loading-spinner" style="display: none;"></div>
                        </button>
                    </div>
                </div>
            </div>

            <div class="typing-indicator" id="typingIndicator" aria-live="polite">
                <span class="sr-only">Assistant is typing</span>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
    </div>

    <!-- Attachment dropdown (opened from + button) -->
    <div id="attachmentDropdown" class="dropdown-menu" role="menu" aria-hidden="true">
        <div class="dropdown-content" role="none">
            <div class="dropdown-label">Attachments</div>
            <button class="dropdown-item" data-action="upload-document" role="menuitem" tabindex="-1">
                <!-- icon: file-text -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                Upload document
            </button>
            <button class="dropdown-item" data-action="upload-image" role="menuitem" tabindex="-1">
                <!-- icon: image -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                Upload image
            </button>
            <button class="dropdown-item" data-action="capture-image" role="menuitem" tabindex="-1">
                <!-- icon: camera -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                Capture image
            </button>
            <button class="dropdown-item" data-action="upload-video" role="menuitem" tabindex="-1">
                <!-- icon: video -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2" ry="2"/><path d="m22 7-6 4 6 4z"/></svg>
                Upload video
            </button>
            <button class="dropdown-item" data-action="capture-video" role="menuitem" tabindex="-1">
                <!-- icon: video camera -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-5 3v4l5 3V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                Capture video
            </button>
            <button class="dropdown-item" data-action="upload-audio" role="menuitem" tabindex="-1">
                <!-- icon: audio (music) -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                Upload audio
            </button>
            <button class="dropdown-item" data-action="capture-audio" role="menuitem" tabindex="-1">
                <!-- icon: mic -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v7a3 3 0 1 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10a7 7 0 0 1-14 0"/><path d="M12 17v6"/><path d="M8 23h8"/></svg>
                Capture audio
            </button>
            <div class="dropdown-separator" role="separator"></div>
            <button class="dropdown-item" data-action="clear" role="menuitem" tabindex="-1">
                <!-- icon: x -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
                Clear input
            </button>
        </div>
    </div>

    <!-- Load the modular JavaScript -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
