<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Capture API Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: #1e1e1f;
            color: #f5f5f5;
            max-width: 1200px;
            margin: 0 auto;
        }

        .test-section {
            background: #2a2a2b;
            border: 1px solid #333436;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .test-section h2 {
            color: #3b82f6;
            margin-top: 0;
            border-bottom: 1px solid #333436;
            padding-bottom: 10px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #2563eb;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        button.danger {
            background: #ef4444;
        }

        button.danger:hover {
            background: #dc2626;
        }

        .status {
            background: #333;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .preview-item {
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            background: #333;
        }

        .preview-item img {
            max-width: 100%;
            border-radius: 4px;
        }

        .preview-item video,
        .preview-item audio {
            width: 100%;
            border-radius: 4px;
            background: #000;
        }

        .preview-meta {
            margin-top: 8px;
            font-size: 11px;
            color: #9ca3af;
        }

        .recording-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .recording-timer {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #ef4444;
        }

        .volume-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
        }

        .volume-bar {
            width: 100px;
            height: 6px;
            background: #444;
            border-radius: 3px;
            overflow: hidden;
        }

        .volume-level {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
            width: 0%;
            transition: width 0.1s;
        }

        .support-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .support-item {
            padding: 10px;
            border: 1px solid #444;
            border-radius: 6px;
            text-align: center;
        }

        .support-item.supported {
            background: rgba(34, 197, 94, 0.1);
            border-color: #22c55e;
        }

        .support-item.unsupported {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
        }
    </style>
</head>
<body>
    <h1>🎬 Screen Capture API Test Suite</h1>
    
    <!-- Support Check Section -->
    <div class="test-section">
        <h2>🔍 Support Check</h2>
        <button onclick="checkSupport()">Check Capture Support</button>
        <div id="supportStatus" class="status"></div>
        <div id="supportInfo" class="support-info"></div>
    </div>

    <!-- Screenshot Section -->
    <div class="test-section">
        <h2>📸 Screenshot Tests</h2>
        <div class="button-group">
            <button onclick="testQuickScreenshot()">Quick Screenshot</button>
            <button onclick="testCustomScreenshot()">Custom Screenshot</button>
            <button onclick="testGetSources()">Get Available Sources</button>
            <button onclick="testWindowScreenshot()">Window Screenshot</button>
        </div>
        <div id="screenshotStatus" class="status"></div>
        <div id="screenshotPreviews" class="preview-container"></div>
    </div>

    <!-- Video Recording Section -->
    <div class="test-section">
        <h2>🎥 Video Recording Tests</h2>
        <div class="button-group">
            <button onclick="testStartVideoRecording()">Start Recording</button>
            <button onclick="testPauseVideoRecording()" disabled>Pause Recording</button>
            <button onclick="testResumeVideoRecording()" disabled>Resume Recording</button>
            <button onclick="testStopVideoRecording()" disabled>Stop Recording</button>
        </div>
        <div class="recording-controls">
            <span>Recording Time: </span>
            <span id="videoTimer" class="recording-timer">00:00</span>
        </div>
        <div id="videoStatus" class="status"></div>
        <div id="videoPreviews" class="preview-container"></div>
    </div>

    <!-- Audio Recording Section -->
    <div class="test-section">
        <h2>🎤 Audio Recording Tests</h2>
        <div class="button-group">
            <button onclick="testStartAudioRecording()">Start Audio Recording</button>
            <button onclick="testPauseAudioRecording()" disabled>Pause Audio</button>
            <button onclick="testResumeAudioRecording()" disabled>Resume Audio</button>
            <button onclick="testStopAudioRecording()" disabled>Stop Audio</button>
        </div>
        <div class="recording-controls">
            <span>Recording Time: </span>
            <span id="audioTimer" class="recording-timer">00:00</span>
        </div>
        <div class="volume-indicator">
            <span>Volume:</span>
            <div class="volume-bar">
                <div id="volumeLevel" class="volume-level"></div>
            </div>
            <span id="volumeText">0%</span>
        </div>
        <div id="audioStatus" class="status"></div>
        <div id="audioPreviews" class="preview-container"></div>
    </div>

    <!-- Management Section -->
    <div class="test-section">
        <h2>🎛️ Recording Management</h2>
        <div class="button-group">
            <button onclick="testGetActiveRecordings()">Get Active Recordings</button>
            <button onclick="testStopAllRecordings()" class="danger">Stop All Recordings</button>
            <button onclick="clearPreviews()" class="danger">Clear All Previews</button>
        </div>
        <div id="managementStatus" class="status"></div>
    </div>

    <script>
        // Global state
        let currentVideoRecordingId = null;
        let currentAudioRecordingId = null;
        let videoTimer = null;
        let audioTimer = null;
        let videoStartTime = null;
        let audioStartTime = null;
        let rendererCaptureAPI = null;

        // Logging function
        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ef4444' : type === 'success' ? '#22c55e' : '#f5f5f5';
            element.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            element.scrollTop = element.scrollHeight;
        }

        // Support check
        async function checkSupport() {
            try {
                log('supportStatus', 'Checking capture support...', 'info');
                
                if (!window.chatInputAPI) {
                    log('supportStatus', 'ERROR: chatInputAPI not available!', 'error');
                    return;
                }

                // Initialize renderer capture API
                if (!rendererCaptureAPI && window.RendererCaptureAPI) {
                    rendererCaptureAPI = new window.RendererCaptureAPI();
                    
                    // Set up volume callback
                    rendererCaptureAPI.setVolumeCallback((data) => {
                        const volumeLevel = document.getElementById('volumeLevel');
                        const volumeText = document.getElementById('volumeText');
                        if (volumeLevel && volumeText) {
                            volumeLevel.style.width = `${data.volume}%`;
                            volumeText.textContent = `${data.volume}%`;
                        }
                    });
                }

                // Check support from both main process (screenshots) and renderer (video/audio)
                const mainSupport = await window.chatInputAPI.checkCaptureSupport();
                const rendererSupport = rendererCaptureAPI ? rendererCaptureAPI.checkSupport() : {};
                
                // Combine support information
                const support = {
                    screenshot: mainSupport.screenshot || rendererSupport.screenshot,
                    videoRecording: rendererSupport.videoRecording || false,
                    audioRecording: rendererSupport.audioRecording || false,
                    desktopCapturer: rendererSupport.desktopCapturer || false
                };

                const mainFormats = await window.chatInputAPI.getSupportedFormats();
                const rendererFormats = rendererCaptureAPI ? rendererCaptureAPI.getSupportedFormats() : {};
                
                // Combine format information
                const formats = {
                    video: rendererFormats.video || [],
                    audio: rendererFormats.audio || [],
                    image: mainFormats.image || []
                };
                
                log('supportStatus', `Support check completed: ${JSON.stringify(support)}`, 'success');
                log('supportStatus', `Supported formats: ${JSON.stringify(formats)}`, 'info');

                // Display support info
                const supportDiv = document.getElementById('supportInfo');
                supportDiv.innerHTML = '';
                
                Object.entries(support).forEach(([feature, supported]) => {
                    const div = document.createElement('div');
                    div.className = `support-item ${supported ? 'supported' : 'unsupported'}`;
                    div.innerHTML = `
                        <strong>${feature}</strong><br>
                        ${supported ? '✅ Supported' : '❌ Not Supported'}
                    `;
                    supportDiv.appendChild(div);
                });

            } catch (error) {
                log('supportStatus', `Support check failed: ${error.message}`, 'error');
            }
        }

        // Screenshot tests
        async function testQuickScreenshot() {
            try {
                log('screenshotStatus', 'Taking quick screenshot...', 'info');
                const result = await window.chatInputAPI.quickScreenshot();
                
                if (result.success) {
                    log('screenshotStatus', `Screenshot captured: ${result.screenshot.name} (${formatFileSize(result.screenshot.size)})`, 'success');
                    addPreview('screenshotPreviews', result.screenshot, 'screenshot');
                } else {
                    log('screenshotStatus', `Screenshot failed: ${result.error}`, 'error');
                }
            } catch (error) {
                log('screenshotStatus', `Screenshot error: ${error.message}`, 'error');
            }
        }

        async function testCustomScreenshot() {
            try {
                log('screenshotStatus', 'Taking custom screenshot...', 'info');
                const result = await window.chatInputAPI.takeScreenshot({
                    format: 'png',
                    quality: 1.0,
                    name: `test-screenshot-${Date.now()}.png`
                });
                
                if (result.success) {
                    log('screenshotStatus', `Custom screenshot captured: ${result.screenshot.name}`, 'success');
                    addPreview('screenshotPreviews', result.screenshot, 'screenshot');
                } else {
                    log('screenshotStatus', `Custom screenshot failed: ${result.error}`, 'error');
                }
            } catch (error) {
                log('screenshotStatus', `Custom screenshot error: ${error.message}`, 'error');
            }
        }

        async function testGetSources() {
            try {
                log('screenshotStatus', 'Getting available sources...', 'info');
                const result = await window.chatInputAPI.getScreenshotSources(true);
                
                if (result.success) {
                    log('screenshotStatus', `Found ${result.sources.length} sources`, 'success');
                    result.sources.forEach((source, index) => {
                        log('screenshotStatus', `  ${index + 1}. ${source.name} (${source.type})`, 'info');
                    });
                } else {
                    log('screenshotStatus', `Get sources failed: ${result.error}`, 'error');
                }
            } catch (error) {
                log('screenshotStatus', `Get sources error: ${error.message}`, 'error');
            }
        }

        async function testWindowScreenshot() {
            try {
                log('screenshotStatus', 'Getting window screenshot...', 'info');
                
                // First get sources
                const sourcesResult = await window.chatInputAPI.getScreenshotSources(true);
                if (!sourcesResult.success || sourcesResult.sources.length === 0) {
                    log('screenshotStatus', 'No sources available for window screenshot', 'error');
                    return;
                }

                // Use first window source if available
                const windowSource = sourcesResult.sources.find(s => s.type === 'window');
                if (!windowSource) {
                    log('screenshotStatus', 'No window sources available', 'error');
                    return;
                }

                const result = await window.chatInputAPI.takeWindowScreenshot(windowSource.id);
                
                if (result.success) {
                    log('screenshotStatus', `Window screenshot captured: ${result.screenshot.name}`, 'success');
                    addPreview('screenshotPreviews', result.screenshot, 'screenshot');
                } else {
                    log('screenshotStatus', `Window screenshot failed: ${result.error}`, 'error');
                }
            } catch (error) {
                log('screenshotStatus', `Window screenshot error: ${error.message}`, 'error');
            }
        }

        // Video recording tests
        async function testStartVideoRecording() {
            try {
                log('videoStatus', 'Starting video recording...', 'info');
                
                if (!rendererCaptureAPI) {
                    log('videoStatus', 'Renderer capture API not available', 'error');
                    return;
                }
                
                const result = await rendererCaptureAPI.startScreenRecording({
                    videoBitsPerSecond: 2000000,
                    audioBitsPerSecond: 128000
                });
                
                if (result.success) {
                    currentVideoRecordingId = result.recordingId;
                    videoStartTime = Date.now();
                    log('videoStatus', `Video recording started: ${result.recordingId}`, 'success');
                    
                    // Update UI
                    updateVideoButtons(true);
                    startVideoTimer();
                } else {
                    log('videoStatus', `Video recording failed: ${result.error}`, 'error');
                }
            } catch (error) {
                log('videoStatus', `Video recording error: ${error.message}`, 'error');
            }
        }

        async function testPauseVideoRecording() {
            if (!currentVideoRecordingId || !rendererCaptureAPI) return;
            
            try {
                log('videoStatus', 'Pausing video recording...', 'info');
                const result = rendererCaptureAPI.pauseRecording(currentVideoRecordingId);
                
                if (result.success) {
                    log('videoStatus', 'Video recording paused', 'success');
                    stopVideoTimer();
                } else {
                    log('videoStatus', `Pause failed: ${result.error}`, 'error');
                }
            } catch (error) {
                log('videoStatus', `Pause error: ${error.message}`, 'error');
            }
        }

        async function testResumeVideoRecording() {
            if (!currentVideoRecordingId || !rendererCaptureAPI) return;
            
            try {
                log('videoStatus', 'Resuming video recording...', 'info');
                const result = rendererCaptureAPI.resumeRecording(currentVideoRecordingId);
                
                if (result.success) {
                    log('videoStatus', 'Video recording resumed', 'success');
                    startVideoTimer();
                } else {
                    log('videoStatus', `Resume failed: ${result.error}`, 'error');
                }
            } catch (error) {
                log('videoStatus', `Resume error: ${error.message}`, 'error');
            }
        }

        async function testStopVideoRecording() {
            if (!currentVideoRecordingId || !rendererCaptureAPI) return;
            
            try {
                log('videoStatus', 'Stopping video recording...', 'info');
                const result = await rendererCaptureAPI.stopRecording(currentVideoRecordingId);
                
                if (result.success) {
                    log('videoStatus', `Video recording stopped. Size: ${formatFileSize(result.video.size)}`, 'success');
                    addPreview('videoPreviews', result.video, 'video');
                    
                    // Reset state
                    currentVideoRecordingId = null;
                    updateVideoButtons(false);
                    stopVideoTimer();
                } else {
                    log('videoStatus', `Stop failed: ${result.error}`, 'error');
                }
            } catch (error) {
                log('videoStatus', `Stop error: ${error.message}`, 'error');
            }
        }

        // Audio recording tests
        async function testStartAudioRecording() {
            try {
                log('audioStatus', 'Starting audio recording...', 'info');
                
                if (!rendererCaptureAPI) {
                    log('audioStatus', 'Renderer capture API not available', 'error');
                    return;
                }
                
                const result = await rendererCaptureAPI.startAudioRecording({
                    audioBitsPerSecond: 128000,
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                });
                
                if (result.success) {
                    currentAudioRecordingId = result.recordingId;
                    audioStartTime = Date.now();
                    log('audioStatus', `Audio recording started: ${result.recordingId}`, 'success');
                    
                    // Update UI
                    updateAudioButtons(true);
                    startAudioTimer();
                } else {
                    log('audioStatus', `Audio recording failed: ${result.error}`, 'error');
                }
            } catch (error) {
                log('audioStatus', `Audio recording error: ${error.message}`, 'error');
            }
        }

        async function testPauseAudioRecording() {
            if (!currentAudioRecordingId || !rendererCaptureAPI) return;
            
            try {
                log('audioStatus', 'Pausing audio recording...', 'info');
                const result = rendererCaptureAPI.pauseRecording(currentAudioRecordingId);
                
                if (result.success) {
                    log('audioStatus', 'Audio recording paused', 'success');
                    stopAudioTimer();
                } else {
                    log('audioStatus', `Pause failed: ${result.error}`, 'error');
                }
            } catch (error) {
                log('audioStatus', `Pause error: ${error.message}`, 'error');
            }
        }

        async function testResumeAudioRecording() {
            if (!currentAudioRecordingId || !rendererCaptureAPI) return;
            
            try {
                log('audioStatus', 'Resuming audio recording...', 'info');
                const result = rendererCaptureAPI.resumeRecording(currentAudioRecordingId);
                
                if (result.success) {
                    log('audioStatus', 'Audio recording resumed', 'success');
                    startAudioTimer();
                } else {
                    log('audioStatus', `Resume failed: ${result.error}`, 'error');
                }
            } catch (error) {
                log('audioStatus', `Resume error: ${error.message}`, 'error');
            }
        }

        async function testStopAudioRecording() {
            if (!currentAudioRecordingId || !rendererCaptureAPI) return;
            
            try {
                log('audioStatus', 'Stopping audio recording...', 'info');
                const result = await rendererCaptureAPI.stopRecording(currentAudioRecordingId);
                
                if (result.success) {
                    log('audioStatus', `Audio recording stopped. Size: ${formatFileSize(result.audio.size)}`, 'success');
                    addPreview('audioPreviews', result.audio, 'audio');
                    
                    // Reset state
                    currentAudioRecordingId = null;
                    updateAudioButtons(false);
                    stopAudioTimer();
                } else {
                    log('audioStatus', `Stop failed: ${result.error}`, 'error');
                }
            } catch (error) {
                log('audioStatus', `Stop error: ${error.message}`, 'error');
            }
        }

        // Management tests
        async function testGetActiveRecordings() {
            try {
                log('managementStatus', 'Getting active recordings...', 'info');
                
                let recordings = [];
                if (rendererCaptureAPI) {
                    recordings = rendererCaptureAPI.getActiveRecordings();
                }
                
                log('managementStatus', `Found ${recordings.length} active recordings`, 'success');
                recordings.forEach((recording, index) => {
                    log('managementStatus', `  ${index + 1}. ${recording.id} (${recording.type}) - ${Math.round(recording.duration)}s`, 'info');
                });
            } catch (error) {
                log('managementStatus', `Get active recordings error: ${error.message}`, 'error');
            }
        }

        async function testStopAllRecordings() {
            try {
                log('managementStatus', 'Stopping all recordings...', 'info');
                
                let results = [];
                if (rendererCaptureAPI) {
                    results = await rendererCaptureAPI.stopAllRecordings();
                }
                
                log('managementStatus', `Stop all completed. Results: ${results.length}`, 'success');
                results.forEach((result, index) => {
                    const status = result.result.success ? 'success' : 'error';
                    log('managementStatus', `  ${index + 1}. ${result.recordingId}: ${result.result.success ? 'Stopped' : result.result.error}`, status);
                });

                // Reset UI
                currentVideoRecordingId = null;
                currentAudioRecordingId = null;
                updateVideoButtons(false);
                updateAudioButtons(false);
                stopVideoTimer();
                stopAudioTimer();
            } catch (error) {
                log('managementStatus', `Stop all recordings error: ${error.message}`, 'error');
            }
        }

        // Utility functions
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

                 function addPreview(containerId, mediaData, type) {
             const container = document.getElementById(containerId);
             const previewDiv = document.createElement('div');
             previewDiv.className = 'preview-item';
             
             let mediaElement = '';
             let debugInfo = '';
             let videoId = null; // Declare at function scope
             
             if (type === 'screenshot' || type === 'image') {
                 mediaElement = `<img src="${mediaData.data}" alt="${mediaData.name}" style="max-width: 100%; border-radius: 4px;" />`;
             } else if (type === 'video') {
                 videoId = `video_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                 
                 // Add debug info for video
                 debugInfo = `
                     <div style="font-size: 10px; color: #888; margin-top: 5px;">
                         🔍 Debug: Type: ${mediaData.type}, Size: ${mediaData.size} bytes<br>
                         ${mediaData.isObjectUrl ? 'Using Object URL' : 'Using Data URL'}<br>
                         ${mediaData.metadata ? `Chunks: ${mediaData.metadata.chunks}, MIME: ${mediaData.metadata.mimeType}` : ''}
                     </div>
                 `;
                 
                 mediaElement = `
                     <video id="${videoId}" controls preload="metadata" style="width: 100%; max-height: 300px; background: #000; border-radius: 4px;">
                         <source src="${mediaData.data}" type="${mediaData.type}">
                         Your browser does not support the video element.
                     </video>
                     <div style="margin-top: 5px;">
                         <button onclick="testVideoPlayback('${videoId}')" style="font-size: 11px; padding: 4px 8px;">Test Playback</button>
                         <button onclick="downloadMedia('${mediaData.data}', '${mediaData.name}')" style="font-size: 11px; padding: 4px 8px;">Download</button>
                         ${mediaData.isObjectUrl ? `<button onclick="copyVideoUrl('${mediaData.data}')" style="font-size: 11px; padding: 4px 8px;">Copy URL</button>` : ''}
                     </div>
                 `;
             } else if (type === 'audio') {
                 const audioId = `audio_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                 mediaElement = `
                     <audio id="${audioId}" controls preload="metadata" style="width: 100%; border-radius: 4px;">
                         <source src="${mediaData.data}" type="${mediaData.type}">
                         Your browser does not support the audio element.
                     </audio>
                     <div style="margin-top: 5px;">
                         <button onclick="downloadMedia('${mediaData.data}', '${mediaData.name}')" style="font-size: 11px; padding: 4px 8px;">Download</button>
                     </div>
                 `;
             }
             
             previewDiv.innerHTML = `
                 ${mediaElement}
                 <div class="preview-meta">
                     <strong>${mediaData.name}</strong><br>
                     Size: ${formatFileSize(mediaData.size)}<br>
                     Type: ${mediaData.type}<br>
                     ${mediaData.duration ? `Duration: ${Math.round(mediaData.duration)}s<br>` : ''}
                     ${mediaData.dimensions ? `Dimensions: ${mediaData.dimensions.width}x${mediaData.dimensions.height}<br>` : ''}
                     Captured: ${new Date(mediaData.timestamp).toLocaleTimeString()}
                 </div>
                 ${debugInfo}
             `;
             
             container.appendChild(previewDiv);
             
             // For videos, add event listeners for debugging
             if (type === 'video' && videoId) {
                 setTimeout(() => {
                     const video = document.getElementById(videoId);
                     if (video) {
                         video.addEventListener('loadstart', () => log('videoStatus', `📹 Video load started: ${mediaData.name}`, 'info'));
                         video.addEventListener('loadedmetadata', () => {
                             log('videoStatus', `📹 Video metadata loaded: ${video.videoWidth}x${video.videoHeight}, duration: ${video.duration}s`, 'success');
                         });
                         video.addEventListener('canplay', () => log('videoStatus', `📹 Video can play: ${mediaData.name}`, 'success'));
                         video.addEventListener('error', (e) => {
                             console.error('Video error:', e, video.error);
                             log('videoStatus', `❌ Video error: ${video.error ? video.error.message : 'Unknown error'}`, 'error');
                         });
                         
                         // Try to load the video
                         video.load();
                     } else {
                         console.warn('Video element not found with ID:', videoId);
                     }
                 }, 100);
             }
         }

         // Helper functions for video preview
         function testVideoPlayback(videoId) {
             const video = document.getElementById(videoId);
             if (video) {
                 video.currentTime = 0;
                 video.play().then(() => {
                     log('videoStatus', '✅ Video playback test successful', 'success');
                 }).catch(error => {
                     log('videoStatus', `❌ Video playback test failed: ${error.message}`, 'error');
                 });
             }
         }

         function downloadMedia(url, filename) {
             const a = document.createElement('a');
             a.href = url;
             a.download = filename;
             document.body.appendChild(a);
             a.click();
             document.body.removeChild(a);
             log('managementStatus', `📥 Download initiated: ${filename}`, 'info');
         }

         function copyVideoUrl(url) {
             navigator.clipboard.writeText(url).then(() => {
                 log('managementStatus', '📋 Video URL copied to clipboard', 'success');
             }).catch(error => {
                 log('managementStatus', `❌ Failed to copy URL: ${error.message}`, 'error');
             });
         }

        function clearPreviews() {
            document.getElementById('screenshotPreviews').innerHTML = '';
            document.getElementById('videoPreviews').innerHTML = '';
            document.getElementById('audioPreviews').innerHTML = '';
            log('managementStatus', 'All previews cleared', 'success');
        }

        function updateVideoButtons(recording) {
            const buttons = document.querySelectorAll('[onclick*="Video"]');
            buttons[0].disabled = recording; // Start
            buttons[1].disabled = !recording; // Pause
            buttons[2].disabled = !recording; // Resume
            buttons[3].disabled = !recording; // Stop
        }

        function updateAudioButtons(recording) {
            const buttons = document.querySelectorAll('[onclick*="Audio"]');
            buttons[0].disabled = recording; // Start
            buttons[1].disabled = !recording; // Pause
            buttons[2].disabled = !recording; // Resume
            buttons[3].disabled = !recording; // Stop
        }

        function startVideoTimer() {
            stopVideoTimer();
            videoTimer = setInterval(() => {
                if (videoStartTime) {
                    const elapsed = Math.floor((Date.now() - videoStartTime) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    document.getElementById('videoTimer').textContent = 
                        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        function stopVideoTimer() {
            if (videoTimer) {
                clearInterval(videoTimer);
                videoTimer = null;
            }
            document.getElementById('videoTimer').textContent = '00:00';
        }

        function startAudioTimer() {
            stopAudioTimer();
            audioTimer = setInterval(() => {
                if (audioStartTime) {
                    const elapsed = Math.floor((Date.now() - audioStartTime) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    document.getElementById('audioTimer').textContent = 
                        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        function stopAudioTimer() {
            if (audioTimer) {
                clearInterval(audioTimer);
                audioTimer = null;
            }
            document.getElementById('audioTimer').textContent = '00:00';
        }

        // Event listeners for volume and progress
        if (window.chatInputAPI) {
            window.chatInputAPI.onVolumeChange((data) => {
                const volumeLevel = document.getElementById('volumeLevel');
                const volumeText = document.getElementById('volumeText');
                volumeLevel.style.width = `${data.volume}%`;
                volumeText.textContent = `${data.volume}%`;
            });

            window.chatInputAPI.onRecordingProgress((data) => {
                log(data.type === 'video' ? 'videoStatus' : 'audioStatus', 
                    `Progress: ${Math.round(data.duration)}s, ${data.chunksCount} chunks, ${formatFileSize(data.dataSize)}`, 'info');
            });

            window.chatInputAPI.onRecordingError((data) => {
                log('managementStatus', `Recording error: ${data.error}`, 'error');
            });
        }

        // Auto-check support on load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(checkSupport, 500);
        });
    </script>
    <script src="renderer/capture-renderer.js"></script>
</body>
</html>
