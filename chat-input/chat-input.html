<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Input</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            overflow: hidden;
            -webkit-app-region: no-drag;
        }

        .chat-input-container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .chat-input-wrapper {
            width: 100%;
            max-width: 480px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .chat-input-wrapper:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .chat-input-wrapper:focus-within {
            background: rgba(0, 0, 0, 0.95);
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2), 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.4;
            resize: none;
            min-height: 20px;
            max-height: 100px;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        #messageInput::-webkit-scrollbar {
            display: none;
        }

        #messageInput::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .send-button {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-button:hover {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            transform: scale(1.05);
        }

        .send-button:active {
            transform: scale(0.95);
        }

        .send-button svg {
            width: 16px;
            height: 16px;
            color: white;
        }

        .send-button:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            transform: none;
        }

        .send-button:disabled svg {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Animation for window appearance */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-input-container {
            animation: slideUp 0.3s ease-out;
        }

        /* Typing indicator */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dot {
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: typingDot 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingDot {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            40% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="chat-input-container">
        <div class="chat-input-wrapper">
            <textarea 
                id="messageInput" 
                placeholder="Type your message here... (Press Enter to send)" 
                rows="1"
                autocomplete="off"
                spellcheck="false"
            ></textarea>
            
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
            
            <button class="send-button" id="sendButton" title="Send message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                    <path d="M2 2l7.586 7.586"/>
                    <circle cx="11" cy="11" r="2"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');

        // Prevent multiple sends
        let isSending = false;
        let lastMessageSent = '';

        // Auto-resize textarea
        function autoResize() {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
        }

        // Send message function with duplicate prevention
        function sendMessage() {
            const message = messageInput.value.trim();
            
            // Prevent sending empty messages
            if (!message) {
                return;
            }
            
            // Prevent duplicate sends
            if (isSending || message === lastMessageSent) {
                console.log('Chat Input: Message already being sent or duplicate message');
                return;
            }
            
            console.log('Chat Input: Sending message:', message);
            
            // Check if API is available
            if (!window.chatInputAPI) {
                console.error('Chat Input: chatInputAPI not available');
                return;
            }
            
            // Set sending state to prevent duplicates
            isSending = true;
            lastMessageSent = message;
            
            // Show typing indicator and disable send button
            typingIndicator.classList.add('active');
            sendButton.disabled = true;
            messageInput.disabled = true;
            
            // Send message to main process using the exposed API
            try {
                window.chatInputAPI.sendMessage({
                    content: message,
                    timestamp: new Date().toISOString(),
                    id: Date.now().toString()
                });
                console.log('Chat Input: Message sent successfully');
                
                // Clear input immediately after sending
                messageInput.value = '';
                autoResize();
                
            } catch (error) {
                console.error('Chat Input: Error sending message:', error);
                // Re-enable input on error
                messageInput.disabled = false;
                sendButton.disabled = false;
                isSending = false;
                lastMessageSent = '';
            }
            
            // Reset sending state after a delay
            setTimeout(() => {
                typingIndicator.classList.remove('active');
                sendButton.disabled = false;
                messageInput.disabled = false;
                isSending = false;
                lastMessageSent = '';
                messageInput.focus();
            }, 1000);
        }

        // Event listeners
        messageInput.addEventListener('input', autoResize);
        
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendButton.addEventListener('click', sendMessage);

        // IPC listeners using the exposed API
        window.chatInputAPI.onClearInput(() => {
            console.log('Chat Input: Clearing input via IPC');
            messageInput.value = '';
            autoResize();
            typingIndicator.classList.remove('active');
            sendButton.disabled = false;
            messageInput.disabled = false;
            isSending = false;
            lastMessageSent = '';
            messageInput.focus();
        });

        window.chatInputAPI.onFocusInput(() => {
            console.log('Chat Input: Focusing input via IPC');
            messageInput.focus();
        });

        // Focus input when window loads
        window.addEventListener('DOMContentLoaded', () => {
            console.log('Chat Input: DOM loaded, checking API availability');
            console.log('Chat Input: chatInputAPI available:', !!window.chatInputAPI);
            if (window.chatInputAPI) {
                console.log('Chat Input: API methods:', Object.keys(window.chatInputAPI));
            }
            messageInput.focus();
        });

        // Handle window focus
        window.addEventListener('focus', () => {
            messageInput.focus();
        });

        // Auto-focus on any keypress
        document.addEventListener('keydown', (e) => {
            if (document.activeElement !== messageInput && 
                !e.ctrlKey && !e.altKey && !e.metaKey &&
                e.key.length === 1) {
                messageInput.focus();
            }
        });
    </script>
</body>
</html>
