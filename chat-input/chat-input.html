<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Input</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #1e1e1f;
            --bg-alt: #262627;
            --bg-popover: #2a2a2b;
            --border: #333436;
            --border-hover: #3d3f42;
            --text: #f5f5f5;
            --text-dim: #9ca3af;
            --accent: #3b82f6;
            --danger: #ef4444;
            --radius: 24px;
            --focus-ring: 0 0 0 2px #1e3a8a, 0 0 0 4px rgba(59, 130, 246, 0.4);
            --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: transparent;
            overflow: hidden;
            color: var(--text);
            -webkit-app-region: no-drag;
        }

        .drag-handle {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 20px;
            -webkit-app-region: drag;
            cursor: move;
            z-index: 20;
            background: transparent;
        }

        .drag-handle:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .chat-input-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 12px 16px;
            max-width: 768px;
            margin: 0 auto;
        }

        .prompt-input {
            position: relative;
            z-index: 10;
            width: 100%;
            background: var(--bg-popover);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-xs);
            transition: all 0.18s ease;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUp 0.28s ease forwards;
        }

        .prompt-input:focus-within {
            border-color: var(--border-hover);
            box-shadow: 0 0 0 1px var(--border-hover), var(--shadow-sm);
        }

        .prompt-content {
            display: flex;
            flex-direction: column;
        }

        .input-area {
            padding: 12px 16px 0;
        }

        #messageInput {
            width: 100%;
            background: transparent;
            border: none;
            resize: none;
            outline: none;
            color: var(--text);
            font-size: 16px;
            line-height: 1.3;
            min-height: 44px;
            max-height: 200px;
            padding: 12px 0;
            font-family: inherit;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        #messageInput::-webkit-scrollbar {
            display: none;
        }

        #messageInput::placeholder {
            color: var(--text-dim);
        }

        .prompt-actions {
            margin-top: 20px;
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 0 12px 12px;
            cursor: move;
        }

        .left-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: move;
        }

        .right-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: move;
        }

        .draggable-area {
            cursor: move;
            flex: 1;
            min-height: 36px;
            display: flex;
            align-items: center;
        }

        .action-btn {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 50%;
            transition: all 0.15s ease;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
        }

        .action-btn:hover {
            background: #303132;
            color: var(--text);
            border-color: var(--border-hover);
        }

        .action-btn:active {
            background: #353637;
        }

        .action-btn:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
        }

        .action-btn[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .action-btn.icon-only {
            width: 36px;
            height: 36px;
        }

        .action-btn.with-text {
            padding: 8px 16px;
            border-radius: 18px;
            gap: 8px;
        }

        .action-btn.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .action-btn.primary:hover {
            background: #2563eb;
            border-color: #2563eb;
        }

        .action-btn.primary:active {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        .loading-spinner {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 2px;
            animation: spin 1s linear infinite;
        }

        .typing-indicator {
            position: absolute;
            left: 16px;
            bottom: -24px;
            display: none;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dot {
            width: 4px;
            height: 4px;
            background: var(--text-dim);
            border-radius: 50%;
            animation: typingDot 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        .action-btn.mic-recording {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
            animation: pulse 1.2s ease-in-out infinite;
        }

        /* Transparency/Lighting Effect Button */
        .action-btn.lighting {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .action-btn.lighting::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.6s ease;
            opacity: 0;
        }

        .action-btn.lighting:hover::before {
            opacity: 1;
            animation: shimmer 1.5s ease-in-out infinite;
        }

        .action-btn.lighting.active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(59, 130, 246, 0.1));
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .action-btn.lighting.active::before {
            background: linear-gradient(45deg, transparent, rgba(59, 130, 246, 0.2), transparent);
        }

        /* Transparency states for the whole window */
        .prompt-input.transparent {
            background: rgba(42, 42, 43, 0.3);
            backdrop-filter: blur(20px);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .prompt-input.transparent:focus-within {
            background: rgba(42, 42, 43, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }

            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes typingDot {

            0%,
            80%,
            100% {
                opacity: 0.3;
                transform: scale(0.6);
            }

            40% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }

            50% {
                box-shadow: 0 0 0 6px rgba(239, 68, 68, 0);
            }
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 640px) {
            .chat-input-container {
                padding: 8px 12px;
            }

            .prompt-actions {
                gap: 6px;
                padding: 0 8px 8px;
            }

            .left-actions,
            .right-actions {
                gap: 6px;
            }

            #messageInput {
                font-size: 14px;
            }
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            border: 0;
        }
    </style>
</head>

<body>
    <div class="chat-input-container">
        <div class="prompt-input" role="form" aria-label="Chat input">
            <div class="drag-handle" title="Drag to move window"></div>
            <div class="prompt-content">
                <div class="input-area">
                    <textarea id="messageInput" placeholder="Ask anything" rows="1" autocomplete="off"
                        spellcheck="false" aria-label="Message input"></textarea>
                </div>

                <div class="prompt-actions">
                    <div class="left-actions">
                        <button class="action-btn icon-only" id="addButton" aria-label="Add attachment"
                            title="Add attachment">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 5v14M5 12h14" />
                            </svg>
                        </button>

                        <!-- Transparency/Lighting Effect Button -->
                        <button class="action-btn icon-only lighting" id="lightingButton"
                            aria-label="Toggle transparency" title="Toggle lighting effect">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="13,2 3,14 12,14 11,22 21,10 12,10 13,2" />
                            </svg>
                        </button>

                        <!-- Future: Search Button (commented out for now)
                        <button class="action-btn with-text" id="searchButton" aria-label="Search" title="Search">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10" />
                                <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                                <path d="M2 12h20" />
                            </svg>
                            Search
                        </button>
                        -->

                        <!-- Future: More Actions Button (commented out for now)
                        <button class="action-btn icon-only" id="moreButton" aria-label="More actions"
                            title="More actions">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="1" />
                                <circle cx="19" cy="12" r="1" />
                                <circle cx="5" cy="12" r="1" />
                            </svg>
                        </button>
                        -->
                    </div>

                    <div class="draggable-area" title="Drag to move window"></div>

                    <div class="right-actions">
                        <!-- Future: Voice Input Button (commented out for now)
                        <button class="action-btn icon-only" id="micButton" aria-label="Voice input"
                            title="Voice input">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 1a3 3 0 0 0-3 3v7a3 3 0 1 0 6 0V4a3 3 0 0 0-3-3Z" />
                                <path d="M19 10a7 7 0 0 1-14 0" />
                                <path d="M12 17v6" />
                                <path d="M8 23h8" />
                            </svg>
                        </button>
                        -->

                        <button class="action-btn icon-only primary" id="sendButton" aria-label="Send message"
                            title="Send (Enter)">
                            <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m5 12 7-7 7 7" />
                                <path d="m12 19 0-14" />
                            </svg>
                            <div id="loadingSpinner" class="loading-spinner" style="display: none;"></div>
                        </button>
                    </div>
                </div>
            </div>

            <div class="typing-indicator" id="typingIndicator" aria-live="polite">
                <span class="sr-only">Assistant is typing</span>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const sendIcon = document.getElementById('sendIcon');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const typingIndicator = document.getElementById('typingIndicator');
        const addButton = document.getElementById('addButton');
        const lightingButton = document.getElementById('lightingButton');
        const promptInput = document.querySelector('.prompt-input');
        const dragHandle = document.querySelector('.drag-handle');
        const promptActions = document.querySelector('.prompt-actions');
        const leftActions = document.querySelector('.left-actions');
        const rightActions = document.querySelector('.right-actions');
        const draggableArea = document.querySelector('.draggable-area');

        // Future buttons (commented out)
        // const micButton = document.getElementById('micButton');
        // const searchButton = document.getElementById('searchButton');
        // const moreButton = document.getElementById('moreButton');

        // State management
        let isSending = false;
        let lastMessageSent = '';
        let isTransparent = false;
        // let recording = false; // Future voice recording state
        
        // Drag state
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };

        // Auto-resize textarea with smooth expansion
        function autoResize() {
            messageInput.style.height = 'auto';
            const maxHeight = 200;
            const newHeight = Math.min(messageInput.scrollHeight, maxHeight);
            messageInput.style.height = newHeight + 'px';

            // Adjust window height dynamically
            adjustWindowHeight();
        }

        // Adjust window height based on content
        function adjustWindowHeight() {
            const container = document.querySelector('.chat-input-container');
            const promptInput = document.querySelector('.prompt-input');
            const currentHeight = promptInput.offsetHeight;

            // Notify main process about height change for window resizing
            if (window.chatInputAPI?.updateWindowHeight) {
                window.chatInputAPI.updateWindowHeight(currentHeight + 40); // Add padding
            }
        }

        // Update send button state
        function updateSendButton() {
            const hasText = messageInput.value.trim().length > 0;
            sendButton.disabled = !hasText || isSending;

            if (isSending) {
                sendIcon.style.display = 'none';
                loadingSpinner.style.display = 'block';
            } else {
                sendIcon.style.display = 'block';
                loadingSpinner.style.display = 'none';
            }
        }

        // Send message function with enhanced feedback
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isSending || message === lastMessageSent) return;

            if (!window.chatInputAPI) {
                console.error('Chat Input: chatInputAPI not available');
                return;
            }

            // Set loading state
            isSending = true;
            lastMessageSent = message;
            updateSendButton();
            typingIndicator.classList.add('active');
            messageInput.disabled = true;

            try {
                window.chatInputAPI.sendMessage({
                    content: message,
                    timestamp: new Date().toISOString(),
                    id: Date.now().toString(),
                    type: 'text'
                });

                // Clear input immediately for better UX
                messageInput.value = '';
                autoResize();

            } catch (err) {
                console.error('Chat Input: Error sending message', err);
                resetSendingState();
            }

            // Reset state after delay
            setTimeout(() => {
                resetSendingState();
                messageInput.focus();
            }, 1200);
        }

        // Reset sending state
        function resetSendingState() {
            isSending = false;
            lastMessageSent = '';
            typingIndicator.classList.remove('active');
            messageInput.disabled = false;
            updateSendButton();
        }

        // Toggle transparency/lighting effect
        function toggleLighting() {
            isTransparent = !isTransparent;
            promptInput.classList.toggle('transparent', isTransparent);
            lightingButton.classList.toggle('active', isTransparent);
            lightingButton.setAttribute('aria-pressed', isTransparent.toString());

            // Visual feedback animation
            lightingButton.animate([
                { transform: 'scale(1)' },
                { transform: 'scale(1.1)' },
                { transform: 'scale(1)' }
            ], { duration: 200, easing: 'ease-out' });
        }

        // Future: Voice recording toggle (commented out)
        /*
        function toggleRecording() {
            recording = !recording;
            micButton.classList.toggle('mic-recording', recording);
            micButton.setAttribute('aria-pressed', recording.toString());

            if (recording) {
                typingIndicator.classList.add('active');
                // Future: Start actual voice recording
            } else {
                typingIndicator.classList.remove('active');
                // Future: Stop voice recording and process
            }
        }
        */

        // Add attachment handler with animation
        function handleAdd() {
            if (window.chatInputAPI?.openAttachmentPicker) {
                window.chatInputAPI.openAttachmentPicker();
            } else {
                // Visual feedback animation
                addButton.animate([
                    { transform: 'scale(1)', background: 'transparent' },
                    { transform: 'scale(1.1)', background: '#303132' },
                    { transform: 'scale(1)', background: 'transparent' }
                ], { duration: 200, easing: 'ease-out' });
            }
        }

        // Future: Search handler (commented out)
        /*
        function handleSearch() {
            if (window.chatInputAPI?.openSearch) {
                window.chatInputAPI.openSearch();
            } else {
                // Visual feedback
                searchButton.animate([
                    { transform: 'scale(1)' },
                    { transform: 'scale(1.05)' },
                    { transform: 'scale(1)' }
                ], { duration: 150, easing: 'ease-out' });
            }
        }
        */

        // Future: More actions handler (commented out)
        /*
        function handleMore() {
            if (window.chatInputAPI?.openMoreActions) {
                window.chatInputAPI.openMoreActions();
            } else {
                // Visual feedback
                moreButton.animate([
                    { transform: 'rotate(0deg)' },
                    { transform: 'rotate(90deg)' },
                    { transform: 'rotate(0deg)' }
                ], { duration: 200, easing: 'ease-out' });
            }
        }
        */

        // Event listeners
        messageInput.addEventListener('input', () => {
            autoResize();
            updateSendButton();
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            } else if (e.key === 'Escape') {
                messageInput.blur();
            }
        });

        // Button event listeners
        sendButton.addEventListener('click', sendMessage);
        addButton.addEventListener('click', handleAdd);
        lightingButton.addEventListener('click', toggleLighting);

        // Future button listeners (commented out)
        // micButton.addEventListener('click', toggleRecording);
        // searchButton.addEventListener('click', handleSearch);
        // moreButton.addEventListener('click', handleMore);

        // IPC listeners using the exposed API
        if (window.chatInputAPI) {
            window.chatInputAPI.onClearInput(() => {
                messageInput.value = '';
                autoResize();
                resetSendingState();
                messageInput.focus();
            });

            window.chatInputAPI.onFocusInput(() => {
                messageInput.focus();
            });
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            messageInput.focus();
            autoResize();
            updateSendButton();
        });

        // Handle window focus
        window.addEventListener('focus', () => {
            messageInput.focus();
        });

        // Auto-focus on keypress
        document.addEventListener('keydown', (e) => {
            if (document.activeElement !== messageInput &&
                !e.ctrlKey && !e.altKey && !e.metaKey &&
                e.key.length === 1 &&
                /^[a-zA-Z0-9\s]$/.test(e.key)) {
                messageInput.focus();
            }
        });

        // Handle paste events
        messageInput.addEventListener('paste', (e) => {
            setTimeout(() => {
                autoResize();
                updateSendButton();
            }, 0);
        });

        // Drag functionality
        function initDragHandling() {
            let startX, startY;
            let lastMoveTime = 0;
            let draggedElement = null;

            // Function to start dragging
            function startDrag(e, element) {
                // Don't start drag if clicking on buttons
                if (e.target.closest('.action-btn')) {
                    return false;
                }

                isDragging = true;
                draggedElement = element;
                startX = e.screenX;
                startY = e.screenY;
                
                element.style.cursor = 'grabbing';
                document.body.style.userSelect = 'none';
                e.preventDefault();
                return true;
            }

            // Add drag listeners to multiple elements
            const draggableElements = [dragHandle, promptActions, leftActions, rightActions, draggableArea];
            
            draggableElements.forEach(element => {
                if (element) {
                    element.addEventListener('mousedown', (e) => {
                        startDrag(e, element);
                    });
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging || !draggedElement) return;
                
                // Throttle move events for better performance
                const now = Date.now();
                if (now - lastMoveTime < 16) return; // ~60fps
                lastMoveTime = now;
                
                const deltaX = e.screenX - startX;
                const deltaY = e.screenY - startY;
                
                if (window.chatInputAPI?.setWindowPosition) {
                    window.chatInputAPI.setWindowPosition(deltaX, deltaY);
                }
                
                // Update start position for next move
                startX = e.screenX;
                startY = e.screenY;
                
                e.preventDefault();
            });

            document.addEventListener('mouseup', () => {
                if (isDragging && draggedElement) {
                    isDragging = false;
                    draggedElement.style.cursor = 'move';
                    document.body.style.userSelect = '';
                    draggedElement = null;
                }
            });

            // Handle drag leaving window
            document.addEventListener('mouseleave', () => {
                if (isDragging && draggedElement) {
                    isDragging = false;
                    draggedElement.style.cursor = 'move';
                    document.body.style.userSelect = '';
                    draggedElement = null;
                }
            });
        }

        // Initialize drag handling
        initDragHandling();
    </script>
</body>

</html>
