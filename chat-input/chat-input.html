<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="css/main.css">
    
</head>

<body>
    <!-- Floating cards container - cards spawn dynamically from template -->
    <div id="floatingCardsContainer"></div>

    <!-- Floating Cards Manager - shows above chat input like attachments -->
    <div class="floating-cards-manager" id="floatingCardsManager" style="display: none;">
        <div class="cards-manager-section" id="cardsManagerSection">
            <div class="cards-manager-header">
                <span class="cards-manager-title">Display Cards</span>
                <div class="cards-manager-actions">
                    <button class="card-manager-btn" id="showAllCardsBtn" title="Show all cards">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        Show All
                    </button>
                    <button class="card-manager-btn" id="hideAllCardsBtn" title="Hide all cards">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                        Hide All
                    </button>
                    <button class="card-manager-btn" id="createNewCardBtn" title="Create new card">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        New
                    </button>
                </div>
            </div>
            <div class="cards-grid" id="cardsGrid">
                <!-- Card previews will be added here dynamically -->
            </div>
        </div>
    </div>

    <!-- Attachments Container - separate from chat input -->
    <div class="attachments-container" id="attachmentsContainer" style="display: none;">
        <div class="attachments-section" id="attachmentsSection">
            <div class="attachments-header">
                <span class="attachments-title">Attachments</span>
                <button class="clear-all-btn" id="clearAllAttachments" title="Clear all attachments">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18"/>
                        <path d="M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="attachments-grid" id="attachmentsGrid">
                <!-- Image previews will be added here dynamically -->
            </div>
        </div>
    </div>

    <!-- Hide/Close Button - positioned outside on the left -->
    <button class="hide-chat-button" id="hideChatButton" aria-label="Hide chat input" title=" ">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/>
            <path d="M6 6l12 12"/>
        </svg>
    </button>

    <!-- Persistent Toggle UI - positioned on the right side of screen -->
    <div class="persistent-toggle" id="persistentToggle">
        <div class="toggle-indicator">
        </div>
    </div>

    <div class="chat-input-container">
        <div class="prompt-input" role="form" aria-label="Chat input">
            <div class="drag-handle" title="Drag to move window"></div>
            <div class="prompt-content">

                <div class="input-area">
                    <button class="action-btn icon-only plus-button" id="plusButton" aria-label="Add content" title="Add content">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </button>
                    <textarea id="messageInput" placeholder="Ask Anything.. " rows="1" autocomplete="off"
                        spellcheck="false" aria-label="Message input"></textarea>
                </div>

                <div class="prompt-actions">
                    <div class="left-actions">
                        <!-- New Chat Button -->
                        <button class="action-btn icon-only" id="newChatButton" aria-label="New Chat"
                            title="New Chat (Clear conversation)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                                <path d="M12 7v6M9 10h6"/>
                            </svg>
                        </button>

                        <!-- AI Model Selection Button -->
                        <button class="action-btn with-text" id="modelSelectButton" aria-label="Select AI Model"
                            title="Select AI Model">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="3"/>
                                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                            </svg>
                            <span id="selectedModelName">Gemini 2.5 Flash</span>
                        </button>

                        <!-- Display Cards Manager Button -->
                        <button class="action-btn icon-only" id="cardsManagerButton" aria-label="Manage Display Cards"
                            title="Manage Display Cards">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="7" height="7" rx="1"/>
                                <rect x="14" y="3" width="7" height="7" rx="1"/>
                                <rect x="3" y="14" width="7" height="7" rx="1"/>
                                <rect x="14" y="14" width="7" height="7" rx="1"/>
                            </svg>
                        </button>

                        
                        <!-- Plus Button for expanded state -->
                        <button class="action-btn icon-only expanded-plus-button" id="expandedPlusButton" aria-label="More actions" title="More actions">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                        </button>
                        
                        <!-- Hidden buttons for dropdown -->
                        <div class="hidden-buttons" id="hiddenButtons">
                            <button class="action-btn icon-only" id="uploadButton" aria-label="Upload files"
                                title="Upload files">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 5v14M5 12h14" />
                                </svg>
                            </button>
                            <button class="action-btn icon-only" id="captureButton" aria-label="Take screenshot"
                                title="Take screenshot">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                                    <circle cx="12" cy="13" r="4"/>
                                </svg>
                            </button>
                            <button class="action-btn icon-only" id="collapseButton" aria-label="Collapse" title="Collapse">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m18 15-6-6-6 6"/>
                                </svg>
                            </button>
                            <!-- Theme Toggle Button -->
                            <button class="action-btn icon-only" id="themeToggleButton"
                                aria-label="Toggle theme" title="Toggle theme (Paper/Dark)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="5"/>
                                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                                </svg>
                            </button>

                            <!-- Transparency/Lighting Effect Button -->
                            <button class="action-btn icon-only lighting" id="lightingButton"
                                aria-label="Toggle transparency" title="Toggle lighting effect">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="13,2 3,14 12,14 11,22 21,10 12,10 13,2" />
                                </svg>
                            </button>

                            <!-- Hide/Show Window Button -->
                            <button class="action-btn icon-only" id="hideShowButton"
                                aria-label="Hide window" title="Hide window (Ctrl+H)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 6h18l-2-2H5l-2 2z"/>
                                    <path d="M21 6v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6"/>
                                    <path d="m8 10 4 4 4-4"/>
                                </svg>
                            </button>

                            <!-- Click-Through Toggle Button -->
                            <button class="action-btn icon-only" id="clickThroughButton"
                                aria-label="Toggle click-through" title="Toggle click-through mode (Ctrl+T)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 2v20"/>
                                    <path d="M5 9l7-7 7 7"/>
                                    <path d="M5 15l7 7 7-7"/>
                                </svg>
                            </button>

                            <!-- Content Protection Button -->
                            <button class="action-btn icon-only" id="contentProtectionButton"
                                aria-label="Toggle content protection" title="Toggle content protection (prevent screen capture)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <circle cx="12" cy="16" r="1"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                            </button>
                        </div>

                        <!-- Future: Search Button (commented out for now)
                        <button class="action-btn with-text" id="searchButton" aria-label="Search" title="Search">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10" />
                                <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                                <path d="M2 12h20" />
                            </svg>
                            Search
                        </button>
                        -->

                        <!-- Future: More Actions Button (commented out for now)
                        <button class="action-btn icon-only" id="moreButton" aria-label="More actions"
                            title="More actions">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="1" />
                                <circle cx="19" cy="12" r="1" />
                                <circle cx="5" cy="12" r="1" />
                            </svg>
                        </button>
                        -->
                    </div>

                    <div class="draggable-area" title="Drag to move window"></div>

                    <div class="right-actions">
                        <!-- Future: Voice Input Button (commented out for now)
                        <button class="action-btn icon-only" id="micButton" aria-label="Voice input"
                            title="Voice input">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 1a3 3 0 0 0-3 3v7a3 3 0 1 0 6 0V4a3 3 0 0 0-3-3Z" />
                                <path d="M19 10a7 7 0 0 1-14 0" />
                                <path d="M12 17v6" />
                                <path d="M8 23h8" />
                            </svg>
                        </button>
                        -->

                        <button class="action-btn icon-only" id="expandButton" aria-label="Expand" title="Expand" style="display: flex;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                            </svg>
                        </button>
                        <button class="action-btn icon-only primary flex items-center justify-center" id="sendButton" aria-label="Send message"
                            title="Send (Enter)" style="display: none; align-items: center; justify-content: center;">
                            <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                style="display: block; margin: auto;">
                                <g>
                                    <path d="M12 2v20" />
                                    <path d="M5 9l7-7 7 7" />
                                </g>
                            </svg>
                            <div id="loadingSpinner" class="loading-spinner" style="display: none;"></div>
                        </button>
                    </div>
                </div>
            </div>

            <div class="typing-indicator" id="typingIndicator" aria-live="polite">
                <span class="sr-only">Assistant is typing</span>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
    </div>

    <!-- Upload dropdown (opened from + button) -->
    <div id="uploadDropdown" class="dropdown-menu compact" role="menu" aria-hidden="true">
        <div class="dropdown-header">
            <span class="dropdown-title">Upload</span>
            <button class="dropdown-close-btn" id="closeUploadDropdown" aria-label="Close dropdown" title="Close">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"/>
                    <path d="M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="dropdown-content" role="none">
            <button class="dropdown-item-compact" data-action="upload-image" role="menuitem" tabindex="-1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                <span>Image</span>
            </button>
            <button class="dropdown-item-compact" data-action="upload-video" role="menuitem" tabindex="-1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2" ry="2"/><path d="m22 7-6 4 6 4z"/></svg>
                <span>Video</span>
            </button>
            <button class="dropdown-item-compact" data-action="upload-audio" role="menuitem" tabindex="-1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                <span>Audio</span>
            </button>
            
        </div>
    </div>

    <!-- Capture dropdown (opened from camera button) -->
    <div id="captureDropdown" class="dropdown-menu compact" role="menu" aria-hidden="true">
        <div class="dropdown-header">
            <span class="dropdown-title">Capture</span>
            <button class="dropdown-close-btn" id="closeCaptureDropdown" aria-label="Close dropdown" title="Close">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"/>
                    <path d="M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="dropdown-content" role="none">
            <button class="dropdown-item-compact" data-action="desktop-capture" role="menuitem" tabindex="-1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                <span>Screenshot</span>
            </button>
            <button class="dropdown-item-compact" data-action="audio-capture" role="menuitem" tabindex="-1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v7a3 3 0 1 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10a7 7 0 0 1-14 0"/><path d="M12 17v6"/><path d="M8 23h8"/></svg>
                <span>Audio Capture</span>
            </button>
            <button class="dropdown-item-compact" data-action="capture-video" role="menuitem" tabindex="-1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-5 3v4l5 3V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                <span>Video</span>
            </button>
        </div>
    </div>

    <!-- Plus Button Actions Dropdown -->
    <div id="plusActionsDropdown" class="dropdown-menu compact" role="menu" aria-hidden="true">
        <div class="dropdown-header">
            <span class="dropdown-title">Actions</span>
            <button class="dropdown-close-btn" id="closePlusActionsDropdown" aria-label="Close dropdown" title="Close">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"/>
                    <path d="M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="dropdown-content" role="none">
            <button class="dropdown-item-compact" data-action="upload" role="menuitem" tabindex="-1" title="Upload">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <span>Upload</span>
            </button>
            <button class="dropdown-item-compact" data-action="capture" role="menuitem" tabindex="-1" title="Capture">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
                <span>Capture</span>
            </button>
            <button class="dropdown-item-compact" data-action="theme" role="menuitem" tabindex="-1" title="Theme">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                <span>Theme</span>
            </button>
            <button class="dropdown-item-compact" data-action="lighting" role="menuitem" tabindex="-1" title="Lighting">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13,2 3,14 12,14 11,22 21,10 12,10 13,2"/>
                </svg>
                <span>Lighting</span>
            </button>
            <button class="dropdown-item-compact" data-action="hide" role="menuitem" tabindex="-1" title="Hide">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18l-2-2H5l-2 2z"/>
                    <path d="M21 6v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6"/>
                    <path d="m8 10 4 4 4-4"/>
                </svg>
                <span>Hide</span>
            </button>
            <button class="dropdown-item-compact" data-action="click-through" role="menuitem" tabindex="-1" title="Click-through">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v20"/>
                    <path d="M5 9l7-7 7 7"/>
                    <path d="M5 15l7 7 7-7"/>
                </svg>
                <span>Click-through</span>
            </button>
            <button class="dropdown-item-compact" data-action="toggle-main" role="menuitem" tabindex="-1" title="Toggle Main">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <path d="M9 9h.01"/>
                    <path d="M15 9h.01"/>
                    <path d="M9 15h.01"/>
                    <path d="M15 15h.01"/>
                </svg>
                <span>Toggle Main</span>
            </button>
            <button class="dropdown-item-compact" data-action="protection" role="menuitem" tabindex="-1" title="Protection">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <circle cx="12" cy="16" r="1"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span>Protection</span>
            </button>
            <button class="dropdown-item-compact" data-action="collapse" role="menuitem" tabindex="-1" title="Collapse">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m18 15-6-6-6 6"/>
                </svg>
                <span>Collapse</span>
            </button>
        </div>
    </div>

    <!-- Modal Backdrop for Model Selection -->
    <div id="modelSelectBackdrop" class="modal-backdrop" style="display: none;"></div>

    <!-- Model Selection dropdown -->
    <div id="modelSelectDropdown" class="dropdown-menu compact" role="menu" aria-hidden="true">
        <div class="dropdown-header">
            <span class="dropdown-title">AI Models</span>
            <button class="dropdown-close-btn" id="closeModelSelectDropdown" aria-label="Close dropdown" title="Close">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"/>
                    <path d="M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="dropdown-content" role="none">
            <!-- Model items will be dynamically generated by model-selection.js -->
        </div>
    </div>

    
    <!-- Content Card Template for Speed Dial -->
    <template id="contentCardTemplate">
        <div class="content-card" style="display: none;">
            <div class="content-card-header">
                <span class="content-card-title">Available Actions</span>
                <div class="content-card-actions">
                    <button class="content-card-close" aria-label="Close content card" title="Close">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6 6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="content-card-body">
                <div class="content-card-content">
                    <!-- Upload Actions -->
                    <div class="action-group">
                        <h4 class="action-group-title">Upload</h4>
                        <div class="action-buttons">
                            <button class="action-item" data-action="upload-image">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                    <circle cx="8.5" cy="8.5" r="1.5"/>
                                    <path d="m21 15-5-5L5 21"/>
                                </svg>
                                <span>Upload Image</span>
                            </button>
                            <button class="action-item" data-action="upload-video">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="6" width="14" height="12" rx="2" ry="2"/>
                                    <path d="m22 7-6 4 6 4z"/>
                                </svg>
                                <span>Upload Video</span>
                            </button>
                            <button class="action-item" data-action="upload-audio">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 18V5l12-2v13"/>
                                    <circle cx="6" cy="18" r="3"/>
                                    <circle cx="18" cy="16" r="3"/>
                                </svg>
                                <span>Upload Audio</span>
                            </button>
                        </div>
                    </div>

                    <!-- Capture Actions -->
                    <div class="action-group">
                        <h4 class="action-group-title">Capture</h4>
                        <div class="action-buttons">
                            <button class="action-item" data-action="desktop-capture">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                                    <circle cx="12" cy="13" r="4"/>
                                </svg>
                                <span>Take Screenshot</span>
                            </button>
                            <button class="action-item" data-action="audio-capture">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 1a3 3 0 0 0-3 3v7a3 3 0 1 0 6 0V4a3 3 0 0 0-3-3Z"/>
                                    <path d="M19 10a7 7 0 0 1-14 0"/>
                                    <path d="M12 17v6"/>
                                    <path d="M8 23h8"/>
                                </svg>
                                <span>Record Audio</span>
                            </button>
                            <button class="action-item" data-action="capture-video">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M23 7l-5 3v4l5 3V7z"/>
                                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                                </svg>
                                <span>Record Video</span>
                            </button>
                        </div>
                    </div>

                    <!-- Settings Actions -->
                    <div class="action-group">
                        <h4 class="action-group-title">Settings</h4>
                        <div class="action-buttons">
                            <button class="action-item" data-action="theme">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="5"/>
                                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                                </svg>
                                <span>Toggle Theme</span>
                            </button>
                            <button class="action-item" data-action="lighting">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="13,2 3,14 12,14 11,22 21,10 12,10 13,2"/>
                                </svg>
                                <span>Lighting Effect</span>
                            </button>
                            <button class="action-item" data-action="click-through">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 2v20"/>
                                    <path d="M5 9l7-7 7 7"/>
                                    <path d="M5 15l7 7 7-7"/>
                                </svg>
                                <span>Click-through Mode</span>
                            </button>
                            <button class="action-item" data-action="protection">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <circle cx="12" cy="16" r="1"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                                <span>Content Protection</span>
                            </button>
                        </div>
                    </div>

                    <!-- MCP Actions -->
                    <div class="action-group">
                        <h4 class="action-group-title">MCP (Model Context Protocol)</h4>
                        <div class="action-buttons">
                            <button class="action-item" data-action="mcp-settings">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <span>MCP Settings</span>
                            </button>
                            <button class="action-item" data-action="mcp-servers">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                    <circle cx="9" cy="9" r="2"/>
                                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                                </svg>
                                <span>MCP Servers</span>
                            </button>
                            <button class="action-item" data-action="mcp-connections">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                                    <path d="M12 11h4"/>
                                    <path d="M12 16h4"/>
                                    <path d="M8 11h.01"/>
                                    <path d="M8 16h.01"/>
                                </svg>
                                <span>MCP Connections</span>
                            </button>
                        </div>
                    </div>

                    <!-- Window Actions -->
                    <div class="action-group">
                        <h4 class="action-group-title">Window</h4>
                        <div class="action-buttons">
                            <button class="action-item" data-action="collapse">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m18 15-6-6-6 6"/>
                                </svg>
                                <span>Collapse</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Floating Card Template for Dynamic Cards -->
    <template id="floatingCardTemplate">
        <div class="floating-card" style="display: flex;">
            <!-- Resize Handles (8-directional Windows-style) -->
            <div class="resize-handle resize-nw"></div>
            <div class="resize-handle resize-n"></div>
            <div class="resize-handle resize-ne"></div>
            <div class="resize-handle resize-e"></div>
            <div class="resize-handle resize-se"></div>
            <div class="resize-handle resize-s"></div>
            <div class="resize-handle resize-sw"></div>
            <div class="resize-handle resize-w"></div>
            
            <div class="floating-card-header">
                <span class="floating-card-title"> </span>
                <div style="display: flex; align-items: center; gap: 4px; position: relative;">
                    <!-- Card Settings (color & appearance) -->
                    <button class="floating-card-settings-btn" aria-label="Card settings" title="Card settings">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                    <div class="floating-card-menu" role="menu" aria-hidden="true" hidden>
                        <button class="floating-card-menu-item" data-action="toggle-neutral" role="menuitem">No color (neutral)</button>
                        <button class="floating-card-menu-item" data-action="next-color" role="menuitem">Next color</button>
                    </div>
                    <!-- Controls: Create New, Show/Hide Content, Expand, Close -->
                    <button class="floating-card-create-btn" aria-label="Create new card" title="Create New Card (Ctrl+N)">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </button>
                    <button class="floating-card-iframe-toggle-btn" aria-label="Toggle content visibility" title="Show/Hide Content">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                    <button class="floating-card-expand-btn" aria-label="Toggle size" title="Expand/Collapse (Double-click header)">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                        </svg>
                    </button>
                    <button class="floating-card-hide-btn" aria-label="Hide card" title="Hide Card">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18l-2-2H5l-2 2z"/>
                            <path d="M21 6v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6"/>
                            <path d="m8 10 4 4 4-4"/>
                        </svg>
                    </button>
                    <button class="floating-card-close" aria-label="Close card" title="Close (Esc)">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6 6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- iframe content -->
            <iframe 
                src="about:blank"
                data-default-src="http://localhost:5173"
                width="100%" 
                height="100%" 
                frameborder="0"
                style="border: white; flex: 1; padding: 0 16px;"
                title="Display Card Content">
            </iframe>
        </div>
    </template>

    <!-- MCP Settings Modal -->
    <div class="mcp-modal" id="mcpSettingsModal" style="display: none;">
        <div class="mcp-modal-content">
            <div class="mcp-modal-header">
                <h2 class="mcp-modal-title">MCP Server Settings</h2>
                <button class="mcp-modal-close" aria-label="Close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <div class="mcp-modal-body">
                <!-- JSON Input Section -->
                <div class="mcp-section">
                    <div class="mcp-section-header">
                        <h3 class="mcp-section-title">Add MCP Servers</h3>
                        <p class="mcp-section-desc">Paste your MCP server configuration JSON</p>
                    </div>

                    <div class="mcp-json-input-container">
                        <textarea 
                            id="mcpJsonInput" 
                            class="mcp-json-textarea"
                            placeholder='Paste your MCP config here, e.g.:
{
  "mcpServers": {
    "shadcn": {
      "command": "npx",
      "args": ["shadcn@latest", "mcp"]
    }
  }
}'
                            spellcheck="false"
                            rows="10"></textarea>
                        <div id="mcpJsonError" class="mcp-message" style="display: none;"></div>
                    </div>

                    <div class="mcp-json-actions">
                        <button class="mcp-btn secondary" id="clearMCPJsonBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                            Clear
                        </button>
                        <button class="mcp-btn primary" id="parseMCPJsonBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                            Add Servers
                        </button>
                    </div>
                </div>

                <!-- Server List Section -->
                <div class="mcp-section">
                    <div class="mcp-section-header">
                        <h3 class="mcp-section-title">Configured Servers</h3>
                        <p class="mcp-section-desc">Manage your MCP server connections</p>
                    </div>

                    <div class="mcp-server-list" id="mcpServerList">
                        <!-- Server items will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="capture/renderer/capture-renderer.js"></script>
    <script type="module" src="modules/index.js"></script>
</body>

</html>
