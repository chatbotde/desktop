<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="chat-css.css">
    
</head>

<body>
    <div class="chat-input-container">
        <div class="prompt-input" role="form" aria-label="Chat input">
            <div class="drag-handle" title="Drag to move window"></div>
            <div class="prompt-content">
                <!-- Image attachments display section -->
                <div class="attachments-section" id="attachmentsSection" style="display: none;">
                    <div class="attachments-header">
                        <span class="attachments-title">Attachments</span>
                        <button class="clear-all-btn" id="clearAllAttachments" title="Clear all attachments">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 6 6 18"/>
                                <path d="M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                    <div class="attachments-grid" id="attachmentsGrid">
                        <!-- Image previews will be added here dynamically -->
                    </div>
                </div>

                <div class="input-area">
                    <textarea id="messageInput" placeholder="Ask.. " rows="1" autocomplete="off"
                        spellcheck="false" aria-label="Message input"></textarea>
                </div>

                <div class="prompt-actions">
                    <div class="left-actions">
                        <button class="action-btn icon-only" id="uploadButton" aria-label="Upload files"
                            title="Upload files">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 5v14M5 12h14" />
                            </svg>
                        </button>
                        <button class="action-btn icon-only" id="captureButton" aria-label="Capture content"
                            title="Capture content">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                                <circle cx="12" cy="13" r="4"/>
                            </svg>
                        </button>
                        <button class="action-btn icon-only" id="collapseButton" aria-label="Collapse" title="Collapse">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m18 15-6-6-6 6"/>
                            </svg>
                        </button>
                        <!-- Transparency/Lighting Effect Button -->
                        <button class="action-btn icon-only lighting" id="lightingButton"
                            aria-label="Toggle transparency" title="Toggle lighting effect">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="13,2 3,14 12,14 11,22 21,10 12,10 13,2" />
                            </svg>
                        </button>

                        <!-- Hide/Show Window Button -->
                        <button class="action-btn icon-only" id="hideShowButton"
                            aria-label="Hide window" title="Hide window (Ctrl+H)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18l-2-2H5l-2 2z"/>
                                <path d="M21 6v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6"/>
                                <path d="m8 10 4 4 4-4"/>
                            </svg>
                        </button>

                        <!-- Toggle Main Window Button -->
                        <button class="action-btn icon-only" id="toggleMainWindowButton"
                            aria-label="Toggle main window" title="Toggle main window visibility (Ctrl+M)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <path d="M9 9h.01"/>
                                <path d="M15 9h.01"/>
                                <path d="M9 15h.01"/>
                                <path d="M15 15h.01"/>
                            </svg>
                        </button>

                        <!-- Future: Search Button (commented out for now)
                        <button class="action-btn with-text" id="searchButton" aria-label="Search" title="Search">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10" />
                                <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                                <path d="M2 12h20" />
                            </svg>
                            Search
                        </button>
                        -->

                        <!-- Future: More Actions Button (commented out for now)
                        <button class="action-btn icon-only" id="moreButton" aria-label="More actions"
                            title="More actions">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="1" />
                                <circle cx="19" cy="12" r="1" />
                                <circle cx="5" cy="12" r="1" />
                            </svg>
                        </button>
                        -->
                    </div>

                    <div class="draggable-area" title="Drag to move window"></div>

                    <div class="right-actions">
                        <!-- Future: Voice Input Button (commented out for now)
                        <button class="action-btn icon-only" id="micButton" aria-label="Voice input"
                            title="Voice input">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 1a3 3 0 0 0-3 3v7a3 3 0 1 0 6 0V4a3 3 0 0 0-3-3Z" />
                                <path d="M19 10a7 7 0 0 1-14 0" />
                                <path d="M12 17v6" />
                                <path d="M8 23h8" />
                            </svg>
                        </button>
                        -->

                        <button class="action-btn icon-only" id="expandButton" aria-label="Expand" title="Expand" style="display: none;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                            </svg>
                        </button>
                        <button class="action-btn icon-only primary flex items-center justify-center" id="sendButton" aria-label="Send message"
                            title="Send (Enter)" style="display: flex; align-items: center; justify-content: center;">
                            <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                style="display: block; margin: auto;">
                                <g>
                                    <path d="M12 2v20" />
                                    <path d="M5 9l7-7 7 7" />
                                </g>
                            </svg>
                            <div id="loadingSpinner" class="loading-spinner" style="display: none;"></div>
                        </button>
                    </div>
                </div>
            </div>

            <div class="typing-indicator" id="typingIndicator" aria-live="polite">
                <span class="sr-only">Assistant is typing</span>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>
    </div>

    <!-- Upload dropdown (opened from + button) -->
    <div id="uploadDropdown" class="dropdown-menu compact" role="menu" aria-hidden="true">
        <div class="dropdown-content" role="none">
            <button class="dropdown-item-compact" data-action="upload-image" role="menuitem" tabindex="-1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                <span>Image</span>
            </button>
            <button class="dropdown-item-compact" data-action="upload-video" role="menuitem" tabindex="-1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2" ry="2"/><path d="m22 7-6 4 6 4z"/></svg>
                <span>Video</span>
            </button>
            <button class="dropdown-item-compact" data-action="upload-audio" role="menuitem" tabindex="-1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                <span>Audio</span>
            </button>
            
        </div>
    </div>

    <!-- Capture dropdown (opened from camera button) -->
    <div id="captureDropdown" class="dropdown-menu compact" role="menu" aria-hidden="true">
        <div class="dropdown-content" role="none">
            <button class="dropdown-item-compact" data-action="capture-desktop" role="menuitem" tabindex="-1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                <span>Screen</span>
            </button>
            <button class="dropdown-item-compact" data-action="capture-video" role="menuitem" tabindex="-1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-5 3v4l5 3V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                <span>Video</span>
            </button>
            <button class="dropdown-item-compact" data-action="capture-audio" role="menuitem" tabindex="-1">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v7a3 3 0 1 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10a7 7 0 0 1-14 0"/><path d="M12 17v6"/><path d="M8 23h8"/></svg>
                <span>Audio</span>
            </button>
        </div>
    </div>

    <script src="chat-input.js"></script>
</body>

</html>
