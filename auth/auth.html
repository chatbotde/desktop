<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Buddy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 50%, #7dd3fc 100%);
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #0c4a6e;
      -webkit-app-region: drag;
      overflow: hidden;
    }

    .title-bar {
      display: flex;
      justify-content: flex-end;
      padding: 8px 12px;
      -webkit-app-region: drag;
    }

    .window-controls {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .window-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .window-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    .window-btn.close:hover {
      background: #ef4444;
    }

    .auth-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 24px 20px;
      -webkit-app-region: no-drag;
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -1px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .tagline {
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      margin-bottom: 24px;
    }

    .auth-view {
      display: none;
      width: 100%;
      max-width: 280px;
    }

    .auth-view.active {
      display: block;
    }

    .btn {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-app-region: no-drag;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #fff;
      color: #0369a1;
      font-weight: 600;
    }

    .btn-primary:hover:not(:disabled) {
      background: #f0f9ff;
    }

    .btn-ghost {
      background: rgba(255,255,255,0.2);
      color: #fff;
      margin-top: 8px;
    }

    .btn-ghost:hover:not(:disabled) {
      background: rgba(255,255,255,0.3);
    }

    .btn-danger {
      background: rgba(255,255,255,0.2);
      color: #fee2e2;
      margin-top: 6px;
    }

    .btn-danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.3);
      color: #fff;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
      color: rgba(255,255,255,0.7);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.3);
    }

    .token-input {
      width: 100%;
      padding: 10px;
      font-size: 12px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 6px;
      color: #0c4a6e;
      outline: none;
      font-family: monospace;
    }

    .token-input:focus {
      border-color: #fff;
      background: #fff;
    }

    .token-input::placeholder {
      color: #64748b;
    }

    .loading-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      text-align: center;
      color: #fff;
      font-size: 12px;
    }

    .user-info {
      text-align: center;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fff;
      color: #0369a1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      margin: 0 auto 10px;
      overflow: hidden;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
      color: #fff;
    }

    .user-email {
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      margin-bottom: 16px;
    }

    .error-view {
      text-align: center;
    }

    .error-msg {
      color: #fff;
      background: rgba(239, 68, 68, 0.8);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 16px;
    }

    .footer {
      text-align: center;
      font-size: 10px;
      color: rgba(255,255,255,0.6);
      margin-top: 20px;
    }

    .footer a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
    }

    .footer a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="title-bar">
    <div class="window-controls">
      <button class="window-btn minimize" id="minimizeBtn">−</button>
      <button class="window-btn maximize" id="maximizeBtn">□</button>
      <button class="window-btn close" id="closeBtn">×</button>
    </div>
  </div>

  <div class="auth-container">
    <div class="logo">Buddy</div>
    <p class="tagline">Your desktop companion</p>

    <!-- Initial View -->
    <div class="auth-view active" id="initialView">
      <button class="btn btn-primary" id="loginBtn">Sign in</button>
      <button class="btn btn-ghost" id="signupBtn">Create account</button>
      
      <div class="divider">or paste token</div>
      
      <input type="text" class="token-input" id="tokenInput" placeholder="Paste token here" autocomplete="off" spellcheck="false">
      <button class="btn btn-ghost" id="submitTokenBtn">Submit token</button>
      
      <p class="footer">
        <a href="#">Terms</a> · <a href="#">Privacy</a>
      </p>
    </div>

    <!-- Loading View -->
    <div class="auth-view" id="loadingView">
      <div class="loading-spinner"></div>
      <p class="loading-text" id="loadingText">Opening browser...</p>
      <button class="btn btn-ghost" id="cancelLoadingBtn" style="margin-top: 16px;">Cancel</button>
    </div>

    <!-- Authenticated View -->
    <div class="auth-view" id="authenticatedView">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">U</div>
        <h2 class="user-name" id="userName">User</h2>
        <p class="user-email" id="userEmail">user@example.com</p>
        <button class="btn btn-primary" id="continueBtn">Continue</button>
        <button class="btn btn-danger" id="logoutBtn">Sign out</button>
      </div>
    </div>

    <!-- Error View -->
    <div class="auth-view" id="errorView">
      <div class="error-view">
        <p class="error-msg" id="errorMessage">Something went wrong</p>
        <button class="btn btn-primary" id="retryBtn">Try again</button>
        <button class="btn btn-ghost" id="backBtn">Back</button>
      </div>
    </div>
  </div>

  <script>
    const views = {
      initial: document.getElementById('initialView'),
      loading: document.getElementById('loadingView'),
      authenticated: document.getElementById('authenticatedView'),
      error: document.getElementById('errorView'),
    };

    const $ = id => document.getElementById(id);

    function showView(name) {
      Object.values(views).forEach(v => v.classList.remove('active'));
      if (views[name]) views[name].classList.add('active');
    }

    function showLoading(text = 'Loading...') {
      $('loadingText').textContent = text;
      showView('loading');
    }

    function showError(msg) {
      $('errorMessage').textContent = msg;
      showView('error');
    }

    function showAuthenticated(user) {
      if (user) {
        $('userName').textContent = user.name || user.displayName || 'User';
        $('userEmail').textContent = user.email || '';
        if (user.image || user.avatar) {
          $('userAvatar').innerHTML = `<img src="${user.image || user.avatar}" alt="">`;
        } else {
          $('userAvatar').textContent = (user.name || user.email || 'U').charAt(0).toUpperCase();
        }
      }
      showView('authenticated');
    }

    // Events
    $('loginBtn').onclick = () => {
      if (window.authAPI) { showLoading('Opening browser...'); window.authAPI.login(); }
    };

    $('signupBtn').onclick = () => {
      if (window.authAPI) { showLoading('Opening browser...'); window.authAPI.signup(); }
    };

    $('logoutBtn').onclick = () => {
      if (window.authAPI) { showLoading('Signing out...'); window.authAPI.logout(); }
    };

    $('continueBtn').onclick = () => {
      if (window.windowAPI) window.windowAPI.close();
    };

    $('retryBtn').onclick = () => showView('initial');
    $('backBtn').onclick = () => showView('initial');
    $('cancelLoadingBtn').onclick = () => { showView('initial'); $('tokenInput').focus(); };

    $('submitTokenBtn').onclick = async () => {
      const token = $('tokenInput').value.trim();
      if (!token) { showError('Please enter a token'); return; }
      if (window.authAPI?.submitManualToken) {
        showLoading('Verifying...');
        try { await window.authAPI.submitManualToken(token); }
        catch (e) { showError(e.message || 'Invalid token'); }
      }
    };

    $('tokenInput').onkeydown = e => { if (e.key === 'Enter') $('submitTokenBtn').click(); };

    // Window controls
    $('closeBtn').onclick = () => window.windowAPI?.close();
    $('minimizeBtn').onclick = () => window.windowAPI?.minimize();
    $('maximizeBtn').onclick = () => window.windowAPI?.maximize();

    // Auth listeners
    if (window.authAPI) {
      window.authAPI.subscribe();
      window.authAPI.onAuthSuccess(user => showAuthenticated(user));
      window.authAPI.onAuthError(err => showError(err.message || 'Authentication failed'));
      window.authAPI.onLogout(() => showView('initial'));
      window.authAPI.onSessionExpired(() => showError('Session expired. Please sign in again.'));
      window.authAPI.onStateChange(state => {
        if (state.isAuthenticated && state.user) showAuthenticated(state.user);
        else showView('initial');
      });
      window.authAPI.onSessionRestored(user => showAuthenticated(user));
      window.authAPI.isAuthenticated().then(async isAuth => {
        if (isAuth) {
          const user = await window.authAPI.getUser();
          if (user) showAuthenticated(user);
        }
      });
    }
  </script>
</body>
</html>
