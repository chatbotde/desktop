<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Sonicthinking</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #020617;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #f8fafc;
      -webkit-app-region: drag;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.15) 0%, rgba(14, 165, 233, 0) 50%);
      pointer-events: none;
      z-index: 0;
    }

    .title-bar {
      display: flex;
      justify-content: flex-end;
      padding: 12px 16px;
      -webkit-app-region: drag;
      z-index: 10;
    }

    .window-controls {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .window-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .window-btn::after {
      content: '';
      font-size: 8px;
      opacity: 0;
      transition: opacity 0.2s;
      color: rgba(0, 0, 0, 0.5);
    }

    .window-controls:hover .window-btn::after {
      opacity: 1;
    }

    .window-btn.close {
      background: #ff5f57;
    }

    .window-btn.close::after {
      content: '×';
    }

    .window-btn.minimize {
      background: #febc2e;
    }

    .window-btn.minimize::after {
      content: '−';
      font-weight: bold;
    }

    .window-btn:hover {
      filter: brightness(0.8);
    }

    .auth-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 32px 40px;
      -webkit-app-region: no-drag;
      z-index: 1;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.1));
    }

    .tagline {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 32px;
      font-weight: 400;
    }

    .auth-view {
      display: none;
      width: 100%;
      max-width: 280px;
    }

    .auth-view.active {
      display: block;
    }

    .btn {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #fff;
      color: #020617;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
    }

    .btn-primary:hover:not(:disabled) {
      background: #f1f5f9;
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 12px;
    }

    .btn-ghost:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.2);
      margin-top: 12px;
    }

    .btn-danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.2);
      color: #fee2e2;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
      color: rgba(255, 255, 255, 0.7);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.3);
    }

    .token-input {
      width: 100%;
      padding: 10px;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 6px;
      color: #0c4a6e;
      outline: none;
      font-family: monospace;
    }

    .token-input:focus {
      border-color: #fff;
      background: #fff;
    }

    .token-input::placeholder {
      color: #64748b;
    }

    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      text-align: center;
      color: #fff;
      font-size: 12px;
    }

    .user-info {
      text-align: center;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fff;
      color: #0369a1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      margin: 0 auto 10px;
      overflow: hidden;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
      color: #fff;
    }

    .user-email {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 16px;
    }

    .error-view {
      text-align: center;
    }

    .error-msg {
      color: #fff;
      background: rgba(239, 68, 68, 0.8);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 16px;
    }

    .footer {
      text-align: center;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 20px;
    }

    .footer a {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
    }

    .footer a:hover {
      color: #fff;
    }


  </style>
</head>

<body>
  <div class="title-bar">
    <div class="window-controls">
      <button class="window-btn minimize" id="minimizeBtn" title="Minimize"></button>
      <button class="window-btn close" id="closeBtn" title="Close"></button>
    </div>
  </div>

  <div class="auth-container">
    <div class="logo">Sonicthinking</div>
    <p class="tagline">Your digital companion</p>

    <!-- Initial View -->
    <div class="auth-view active" id="initialView">
      <button class="btn btn-primary" id="loginBtn">Sign in</button>
      <button class="btn btn-ghost" id="signupBtn">Create account</button>
      <!--
      <div class="divider">or paste token</div>

      <input type="text" class="token-input" id="tokenInput" placeholder="Paste token here" autocomplete="off"
        spellcheck="false">
      <button class="btn btn-ghost" id="submitTokenBtn">Submit token</button>
    
      <p class="footer">
        <a href="#">Terms</a> · <a href="#">Privacy</a>
      </p>
    -->
    </div>

    <!-- Loading View -->
    <div class="auth-view" id="loadingView">
      <div class="loading-spinner"></div>
      <p class="loading-text" id="loadingText">Opening browser...</p>
      <button class="btn btn-ghost" id="cancelLoadingBtn" style="margin-top: 16px;">Cancel</button>
    </div>

    <!-- Authenticated View -->
    <div class="auth-view" id="authenticatedView">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">U</div>
        <h2 class="user-name" id="userName">User</h2>
        <p class="user-email" id="userEmail">user@example.com</p>
        <button class="btn btn-primary" id="continueBtn">Continue</button>
        <button class="btn btn-danger" id="logoutBtn">Sign out</button>
      </div>
    </div>

    <!-- Error View -->
    <div class="auth-view" id="errorView">
      <div class="error-view">
        <p class="error-msg" id="errorMessage">Something went wrong</p>
        <button class="btn btn-primary" id="retryBtn">Try again</button>
        <button class="btn btn-ghost" id="backBtn">Back</button>
      </div>
    </div>
  </div>



  <script>
    const views = {
      initial: document.getElementById('initialView'),
      loading: document.getElementById('loadingView'),
      authenticated: document.getElementById('authenticatedView'),
      error: document.getElementById('errorView'),
    };

    const $ = id => document.getElementById(id);

    function showView(name) {
      Object.values(views).forEach(v => v.classList.remove('active'));
      if (views[name]) views[name].classList.add('active');
    }

    function showLoading(text = 'Loading...') {
      $('loadingText').textContent = text;
      showView('loading');
    }

    function showError(msg) {
      $('errorMessage').textContent = msg;
      showView('error');
    }

    function showAuthenticated(user) {
      if (user) {
        $('userName').textContent = user.name || user.displayName || 'User';
        $('userEmail').textContent = user.email || '';
        if (user.image || user.avatar) {
          $('userAvatar').innerHTML = `<img src="${user.image || user.avatar}" alt="">`;
        } else {
          $('userAvatar').textContent = (user.name || user.email || 'U').charAt(0).toUpperCase();
        }
      }
      showView('authenticated');
    }

    // Events
    $('loginBtn').onclick = () => {
      if (window.authAPI) { showLoading('Opening browser...'); window.authAPI.login(); }
    };

    $('signupBtn').onclick = () => {
      if (window.authAPI) { showLoading('Opening browser...'); window.authAPI.signup(); }
    };

    $('logoutBtn').onclick = () => {
      if (window.authAPI) { showLoading('Signing out...'); window.authAPI.logout(); }
    };

    $('continueBtn').onclick = () => {
      if (window.windowAPI) window.windowAPI.close();
    };

    $('retryBtn').onclick = () => showView('initial');
    $('backBtn').onclick = () => showView('initial');
    $('cancelLoadingBtn').onclick = () => {
      showView('initial');
      $('tokenInput')?.focus();
    };

    const submitTokenBtn = $('submitTokenBtn');
    if (submitTokenBtn) {
      submitTokenBtn.onclick = async () => {
        const tokenInput = $('tokenInput');
        const token = tokenInput?.value.trim();
        if (!token) { showError('Please enter a token'); return; }
        if (window.authAPI?.submitManualToken) {
          showLoading('Verifying...');
          try { await window.authAPI.submitManualToken(token); }
          catch (e) { showError(e.message || 'Invalid token'); }
        }
      };
    }

    const tokenInput = $('tokenInput');
    if (tokenInput) {
      tokenInput.onkeydown = e => { if (e.key === 'Enter') submitTokenBtn?.click(); };
    }

    // Window controls
    $('closeBtn').onclick = () => window.windowAPI?.close();
    $('minimizeBtn').onclick = () => window.windowAPI?.minimize();

    // Auth listeners
    if (window.authAPI) {
      window.authAPI.subscribe();
      window.authAPI.onAuthSuccess(user => showAuthenticated(user));
      window.authAPI.onAuthError(err => showError(err.message || 'Authentication failed'));
      window.authAPI.onLogout(() => showView('initial'));
      window.authAPI.onSessionExpired(() => showError('Session expired. Please sign in again.'));
      window.authAPI.onStateChange(state => {
        if (state.isAuthenticated && state.user) showAuthenticated(state.user);
        else showView('initial');
      });
      window.authAPI.onSessionRestored(user => showAuthenticated(user));
      window.authAPI.isAuthenticated().then(async isAuth => {
        if (isAuth) {
          const user = await window.authAPI.getUser();
          if (user) showAuthenticated(user);
        }
      });


    }
  </script>
</body>

</html>
