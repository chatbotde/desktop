<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Interfaces</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: none;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Title Bar */
    .titlebar {
      -webkit-app-region: drag;
      height: 32px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
    }

    .titlebar-title {
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
    }

    .titlebar-controls {
      -webkit-app-region: no-drag;
      display: flex;
      gap: 4px;
    }

    .titlebar-btn {
      width: 28px;
      height: 24px;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .titlebar-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .titlebar-btn.close:hover {
      background: #ef4444;
      color: #ffffff;
    }

    /* Main Content */
    .container {
      padding: 24px;
      height: calc(100vh - 32px);
      overflow-y: auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .btn-primary {
      padding: 10px 20px;
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4);
    }

    /* Interface Cards */
    .interfaces-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .interface-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.2s ease;
    }

    .interface-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(14, 165, 233, 0.5);
      transform: translateY(-2px);
    }

    .interface-card h3 {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 8px;
    }

    .interface-card p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .interface-card .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .interface-card .status.inactive {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #94a3b8;
    }

    .empty-state p {
      font-size: 14px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <!-- Title Bar -->
  <div class="titlebar">
    <span class="titlebar-title">Interfaces</span>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="btn-minimize" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
          <rect y="5" width="12" height="2"/>
        </svg>
      </button>
      <button class="titlebar-btn" id="btn-maximize" title="Maximize">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1" y="1" width="10" height="10" rx="1"/>
        </svg>
      </button>
      <button class="titlebar-btn close" id="btn-close" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
          <path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <div class="header">
      <h1>Interfaces</h1>
      <button class="btn-primary" id="btn-add">+ Add Interface</button>
    </div>

    <div class="interfaces-grid" id="interfaces-list">
      <!-- Interface cards will be added here dynamically -->
    </div>

    <div class="empty-state" id="empty-state" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 3v18M3 12h18M7 7l10 10M17 7L7 17" stroke-linecap="round"/>
      </svg>
      <h3>No interfaces yet</h3>
      <p>Click "Add Interface" to create your first interface.</p>
    </div>
  </div>

  <script>
    // Window controls
    document.getElementById('btn-minimize').addEventListener('click', () => {
      window.interfacesAPI.minimize();
    });

    document.getElementById('btn-maximize').addEventListener('click', () => {
      window.interfacesAPI.maximize();
    });

    document.getElementById('btn-close').addEventListener('click', () => {
      window.interfacesAPI.close();
    });

    // Interface list rendering
    const interfacesList = document.getElementById('interfaces-list');
    const emptyState = document.getElementById('empty-state');

    function renderInterfaces(interfaces) {
      if (!interfaces || interfaces.length === 0) {
        interfacesList.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      interfacesList.innerHTML = interfaces.map(iface => `
        <div class="interface-card" data-id="${iface.id}">
          <h3>${iface.name}</h3>
          <p>${iface.description || 'No description'}</p>
          <span class="status ${iface.active ? '' : 'inactive'}">
            <span class="status-dot"></span>
            ${iface.active ? 'Active' : 'Inactive'}
          </span>
        </div>
      `).join('');
    }

    // Add button handler
    document.getElementById('btn-add').addEventListener('click', async () => {
      // Implement add interface logic
      console.log('Add interface clicked');
    });

    // Load interfaces on startup
    async function init() {
      try {
        const interfaces = await window.interfacesAPI.getInterfaces();
        renderInterfaces(interfaces);
      } catch (error) {
        console.error('Failed to load interfaces:', error);
        renderInterfaces([]);
      }
    }

    // Listen for updates
    window.interfacesAPI.onDataUpdate((data) => {
      renderInterfaces(data);
    });

    init();
  </script>
</body>
</html>
