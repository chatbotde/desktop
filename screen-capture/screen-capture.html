<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Screen Capture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            cursor: none;
            -webkit-app-region: drag;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            -webkit-app-region: no-drag;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
        }

        .security-indicator {
            width: 12px;
            height: 12px;
            background: #00ff00;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .window-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .minimize-btn {
            background: #ffc107;
        }

        .close-btn {
            background: #dc3545;
            color: white;
        }

        .control-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        .content {
            flex: 1;
            display: flex;
            gap: 30px;
        }

        .sources-panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .controls-panel {
            width: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #ffffff;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .sources-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .source-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .source-item:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #007bff;
            transform: translateY(-2px);
        }

        .source-item.selected {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }

        .source-thumbnail {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .source-name {
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .recording-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .record-btn {
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .record-screen {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
        }

        .record-video {
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: white;
        }

        .record-audio {
            background: linear-gradient(135deg, #ffc107, #e0a800);
            color: #333;
        }

        .stop-recording {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
        }

        .record-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .record-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .recording-status {
            padding: 15px;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 12px;
            border: 1px solid #dc3545;
            text-align: center;
            display: none;
        }

        .recording-status.active {
            display: block;
            animation: recordingPulse 1s infinite;
        }

        @keyframes recordingPulse {
            0% { border-color: #dc3545; }
            50% { border-color: #ff6b7a; }
            100% { border-color: #dc3545; }
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            background: #dc3545;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .security-notice {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            font-size: 12px;
            text-align: center;
            color: #00ff00;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            font-size: 16px;
            color: #888;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">
                <div class="security-indicator"></div>
                Secure Screen Capture
            </div>
            <div class="window-controls">
                <button class="control-btn minimize-btn" id="minimizeBtn">−</button>
                <button class="control-btn close-btn" id="closeBtn">×</button>
            </div>
        </div>

        <div class="content">
            <div class="sources-panel">
                <div class="panel-title">Available Sources</div>
                <div class="sources-grid" id="sourcesGrid">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading available sources...
                    </div>
                </div>
            </div>

            <div class="controls-panel">
                <div class="panel-title">Recording Controls</div>
                
                <div class="recording-status" id="recordingStatus">
                    <span class="status-indicator"></span>
                    <span id="recordingText">Recording in progress...</span>
                </div>

                <div class="recording-controls">
                    <button class="record-btn record-screen" id="recordScreenBtn">
                        📺 Record Screen
                    </button>
                    
                    <button class="record-btn record-video" id="recordVideoBtn">
                        🎥 Record Video
                    </button>
                    
                    <button class="record-btn record-audio" id="recordAudioBtn">
                        🎵 Record Audio
                    </button>
                    
                    <button class="record-btn stop-recording" id="stopRecordingBtn" style="display: none;">
                        ⏹️ Stop Recording
                    </button>
                </div>

                <div class="security-notice">
                    🔒 This window is protected from screen capture and recording. 
                    Use it safely for sensitive media operations.
                </div>
            </div>
        </div>
    </div>

    <script>
        // Secure screen capture interface
        class ScreenCaptureInterface {
            constructor() {
                this.selectedSource = null;
                this.isRecording = false;
                this.currentRecordingType = null;
                this.init();
            }

            async init() {
                this.setupEventListeners();
                await this.loadScreenSources();
                this.setupRecordingEventHandlers();
            }

            setupEventListeners() {
                // Window controls
                document.getElementById('minimizeBtn').addEventListener('click', () => {
                    window.screenCaptureAPI.minimizeWindow();
                });

                document.getElementById('closeBtn').addEventListener('click', () => {
                    window.screenCaptureAPI.closeWindow();
                });

                // Recording controls
                document.getElementById('recordScreenBtn').addEventListener('click', () => {
                    this.startRecording('screen');
                });

                document.getElementById('recordVideoBtn').addEventListener('click', () => {
                    this.startRecording('video');
                });

                document.getElementById('recordAudioBtn').addEventListener('click', () => {
                    this.startRecording('audio');
                });

                document.getElementById('stopRecordingBtn').addEventListener('click', () => {
                    this.stopRecording();
                });
            }

            async loadScreenSources() {
                try {
                    const sources = await window.screenCaptureAPI.getScreenSources();
                    this.renderSources(sources);
                } catch (error) {
                    console.error('Screen Capture Window: Failed to load sources:', error);
                    this.renderError('Failed to load screen sources');
                }
            }

            renderSources(sources) {
                const sourcesGrid = document.getElementById('sourcesGrid');
                
                if (sources.length === 0) {
                    sourcesGrid.innerHTML = '<div class="loading">No sources available</div>';
                    return;
                }

                sourcesGrid.innerHTML = sources.map(source => `
                    <div class="source-item" data-source-id="${source.id}">
                        <img class="source-thumbnail" src="${source.thumbnail}" alt="${source.name}">
                        <div class="source-name">${source.name}</div>
                    </div>
                `).join('');

                // Add click handlers
                sourcesGrid.querySelectorAll('.source-item').forEach(item => {
                    item.addEventListener('click', () => {
                        this.selectSource(item.dataset.sourceId, item);
                    });
                });
            }

            renderError(message) {
                document.getElementById('sourcesGrid').innerHTML = `
                    <div class="loading" style="color: #dc3545;">
                        ⚠️ ${message}
                    </div>
                `;
            }

            selectSource(sourceId, element) {
                // Remove previous selection
                document.querySelectorAll('.source-item').forEach(item => {
                    item.classList.remove('selected');
                });

                // Add selection to clicked item
                element.classList.add('selected');
                this.selectedSource = sourceId;

                console.log('Screen Capture Window: Source selected:', sourceId);
            }

            async startRecording(type) {
                if (this.isRecording) {
                    console.log('Screen Capture Window: Recording already in progress');
                    return;
                }

                if (type !== 'audio' && !this.selectedSource) {
                    alert('Please select a source first');
                    return;
                }

                try {
                    let success = false;
                    
                    switch (type) {
                        case 'screen':
                            success = await window.screenCaptureAPI.startScreenRecording(this.selectedSource);
                            break;
                        case 'video':
                            success = await window.screenCaptureAPI.startVideoRecording(this.selectedSource);
                            break;
                        case 'audio':
                            success = await window.screenCaptureAPI.startAudioRecording();
                            break;
                    }

                    if (success) {
                        this.setRecordingState(true, type);
                    }
                } catch (error) {
                    console.error('Screen Capture Window: Failed to start recording:', error);
                }
            }

            async stopRecording() {
                if (!this.isRecording) {
                    return;
                }

                try {
                    const success = await window.screenCaptureAPI.stopRecording();
                    if (success) {
                        this.setRecordingState(false);
                    }
                } catch (error) {
                    console.error('Screen Capture Window: Failed to stop recording:', error);
                }
            }

            setRecordingState(recording, type = null) {
                this.isRecording = recording;
                this.currentRecordingType = type;

                const recordingStatus = document.getElementById('recordingStatus');
                const recordingText = document.getElementById('recordingText');
                const stopBtn = document.getElementById('stopRecordingBtn');
                const recordBtns = document.querySelectorAll('.record-btn:not(.stop-recording)');

                if (recording) {
                    recordingStatus.classList.add('active');
                    recordingText.textContent = `Recording ${type}...`;
                    stopBtn.style.display = 'block';
                    recordBtns.forEach(btn => btn.disabled = true);
                } else {
                    recordingStatus.classList.remove('active');
                    stopBtn.style.display = 'none';
                    recordBtns.forEach(btn => btn.disabled = false);
                }
            }

            setupRecordingEventHandlers() {
                // Listen for recording events from main process
                window.screenCaptureAPI.onRecordingStarted((data) => {
                    console.log('Screen Capture Window: Recording started event:', data);
                    this.setRecordingState(true, data.type);
                });

                window.screenCaptureAPI.onRecordingStopped((data) => {
                    console.log('Screen Capture Window: Recording stopped event:', data);
                    this.setRecordingState(false);
                });
            }
        }

        // Initialize the interface when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new ScreenCaptureInterface();
            console.log('Screen Capture Window: Interface initialized with maximum security');
        });

        // Additional security: Prevent any form of inspection
        document.addEventListener('keydown', (e) => {
            e.stopPropagation();
        });

        // Override common inspection methods
        (function() {
            const noop = () => {};
            window.inspect = noop;
            window.chrome = undefined;
            
            // Disable common debugging
            setInterval(() => {
                debugger;
            }, 100);
        })();
    </script>
</body>
</html>
