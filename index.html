<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #00a8ff;
            box-shadow: 
                0 0 20px rgba(0, 168, 255, 0.4),
                0 0 40px rgba(0, 168, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .titlebar {
            height: 35px;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            -webkit-app-region: drag;
            border-bottom: 1px solid rgba(0, 168, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            cursor: move;
            transition: background-color 0.2s ease;
            border-top-left-radius: 13px;
            border-top-right-radius: 13px;
        }

        .titlebar:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            -webkit-app-region: drag;
            flex: 1;
            font-weight: 500;
        }

        .drag-handle {
            display: flex;
            align-items: center;
            gap: 2px;
            opacity: 0.4;
            margin-left: 8px;
            -webkit-app-region: drag;
        }

        .drag-handle::before,
        .drag-handle::after {
            content: '⋮';
            font-size: 12px;
            color: currentColor;
        }

        .titlebar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            -webkit-app-region: no-drag;
        }

        .close-button {
            background: #ff5f57;
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(255, 95, 87, 0.3);
        }

        .close-button:hover {
            background: #ff3b30;
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(255, 95, 87, 0.5);
        }

        .close-button:active {
            transform: scale(0.95);
        }

        .titlebar-buttons {
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
        }

        .titlebar-button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .titlebar-button:hover {
            opacity: 0.7;
        }

        .close { background: #ff5f57; }
        .minimize { background: #ffbd2e; }
        .maximize { background: #28ca42; }

        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            -webkit-app-region: drag;
            position: relative;
            cursor: move;
            transition: background-color 0.2s ease;
        }

        .content:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .content > * {
            -webkit-app-region: no-drag;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-text {
            font-size: 1.5rem;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.7;
            margin-bottom: 30px;
        }

        .status {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        .api-test {
            padding: 10px 20px;
            background: rgba(40, 202, 66, 0.2);
            border: 1px solid rgba(40, 202, 66, 0.3);
            border-radius: 8px;
            color: #28ca42;
            font-family: 'Courier New', monospace;
        }

        .version-info {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 0.8rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="titlebar">
        <div class="titlebar-left">
            <span>Buddy</span>
            <div class="drag-handle"></div>
        </div>
        <div class="titlebar-right">
            <button class="close-button" onclick="closeApp()" title="Close">✕</button>
            <div class="titlebar-buttons">
                <button class="titlebar-button close" onclick="closeApp()"></button>
                <button class="titlebar-button minimize" onclick="minimizeApp()"></button>
                <button class="titlebar-button maximize" onclick="maximizeApp()"></button>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="logo">🚀 Buddy</div>
        <div class="welcome-text">Welcome to your Electron App!</div>
        <div class="subtitle">Your desktop companion is ready to go.</div>
        
        <div class="status">
            <div>Status: <span id="status">Initializing...</span></div>
        </div>

        <div class="api-test">
            API Test: <span id="api-result">Testing...</span>
        </div>
    </div>

    <div class="version-info">
        <div>Electron: <span id="electron-version">Loading...</span></div>
        <div>Node: <span id="node-version">Loading...</span></div>
    </div>

    <script>
        // Test the preload API
        document.addEventListener('DOMContentLoaded', () => {
            // Update status
            document.getElementById('status').textContent = 'Ready';
            
            // Test API from preload script
            if (window.api) {
                const result = window.api.ping();
                document.getElementById('api-result').textContent = result;
            } else {
                document.getElementById('api-result').textContent = 'API not available';
            }

            // Display version info
            if (window.api && window.api.getVersions) {
                window.api.getVersions().then(versions => {
                    document.getElementById('electron-version').textContent = versions.electron || 'Unknown';
                    document.getElementById('node-version').textContent = versions.node || 'Unknown';
                });
            } else {
                document.getElementById('electron-version').textContent = 'Unknown';
                document.getElementById('node-version').textContent = 'Unknown';
            }
        });

        // Window controls using IPC
        function closeApp() {
            if (window.api && window.api.closeWindow) {
                window.api.closeWindow();
            } else {
                console.log('Close API not available');
            }
        }

        function minimizeApp() {
            if (window.api && window.api.minimizeWindow) {
                window.api.minimizeWindow();
            } else {
                console.log('Minimize API not available');
            }
        }

        function maximizeApp() {
            if (window.api && window.api.maximizeWindow) {
                window.api.maximizeWindow();
            } else {
                console.log('Maximize API not available');
            }
        }

        // Add some interactivity
        document.body.addEventListener('click', (e) => {
            if (e.target.classList.contains('logo')) {
                e.target.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    e.target.style.transform = 'scale(1)';
                }, 200);
            }
        });
    </script>
</body>
</html>
