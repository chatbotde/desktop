<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote connection</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f3f4f9;
        color: #1a1c1e;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        background: #fff;
        border-radius: 20px;
        padding: 24px;
        width: 100%;
        max-width: 320px;
        box-shadow: 0 8px 30px rgba(0, 28, 56, 0.08);
        text-align: center;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .sub {
        color: #64748b;
        font-size: 13px;
        margin-bottom: 16px;
      }
      img {
        width: 240px;
        height: 240px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
      }
      .meta {
        margin-top: 16px;
        font-size: 12px;
        color: #475569;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Scan to connect</h1>
      <p class="sub">Open your phone app and scan this code</p>
      <img id="qr" alt="Remote connection QR code" />
      <div class="meta">
        <div>PIN: <strong id="pin"></strong></div>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      document.getElementById('qr').src = decodeURIComponent(params.get('qr') || '');
      document.getElementById('pin').textContent = params.get('pin') || '';
    </script>
  </body>
</html>
