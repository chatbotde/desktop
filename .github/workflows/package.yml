name: Package and Upload

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - deploy
      - json_render
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable hosted auth (official SonicThinking releases only)
        if: github.repository == 'sonicthinking/buddy'
        run: printf '%s\n' '{"hostedAuth":true,"authServerUrl":"https://www.sonicthinking.com"}' > auth/build-config.json
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install dependencies (frontend)
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build and Package Interface Window
        working-directory: interface-window
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Build All Components
        run: npm run build:all

      - name: Build and Package Electron app
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonicthinking-windows-x64
          path: dist/*.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('manual-{0}', github.run_number) }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
