# Builds the Electron app on tag push and uploads installers to chatbotde/buddy-releases (public).
# Required: In this repo add secret RELEASES_REPO_TOKEN (PAT with repo scope) — see README or docs.
name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --ignore-scripts
          cd frontend && npm install --legacy-peer-deps

      - name: Build (Windows) - no publish to private repo
        if: matrix.os == 'windows-latest'
        run: |
          npm run build:all
          npx electron-builder --win --publish never

      - name: List build output
        if: matrix.os == 'windows-latest'
        run: dir dist
        shell: pwsh

      - name: Upload to public releases repo
        if: matrix.os == 'windows-latest' && success()
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          repository: chatbotde/buddy-releases
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: dist/*.exe
          generate_release_notes: true
          target_commitish: main
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
