# Builds the Electron app on tag push and uploads installers to chatbotde/buddy-releases (public).
# Required: In this repo add secret RELEASES_REPO_TOKEN (PAT with repo scope) — see README or docs.
name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Rebuild Native Modules for Electron
        run: npx electron-builder install-app-deps
        shell: bash

      - name: Install Frontend Dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Install Interface Window Dependencies
        run: npm ci --legacy-peer-deps
        working-directory: interface-window

      - name: Build All Components
        if: matrix.os == 'windows-latest'
        run: npm run build:all
        shell: bash

      - name: Verify Frontend Build
        if: matrix.os == 'windows-latest'
        run: |
          echo "=== Checking app-frontend directory ==="
          if (Test-Path "app-frontend") {
            Get-ChildItem -Path "app-frontend" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
            $fileCount = (Get-ChildItem -Path "app-frontend" -Recurse -File).Count
            echo "Total files in app-frontend: $fileCount"
            if ($fileCount -eq 0) {
              Write-Error "app-frontend is empty!"
              exit 1
            }
          } else {
            Write-Error "app-frontend directory does not exist!"
            exit 1
          }
        shell: pwsh

      - name: Final verification before electron-builder
        if: matrix.os == 'windows-latest'
        run: |
          echo "=== Final check before electron-builder ==="
          echo "Current directory contents:"
          ls -la
          echo ""
          echo "app-frontend directory check:"
          if [ -d "app-frontend" ]; then
            echo "✓ app-frontend exists"
            echo "Contents:"
            ls -la app-frontend/
            echo "Total files: $(find app-frontend -type f | wc -l)"
          else
            echo "✗ app-frontend does NOT exist"
            exit 1
          fi
        shell: bash

      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        if: matrix.os == 'windows-latest'
        run: dir dist
        shell: pwsh

      - name: Verify packaged app structure
        if: matrix.os == 'windows-latest'
        run: |
          echo "=== Checking win-unpacked structure ==="
          if (Test-Path "dist/win-unpacked") {
            echo "Resources directory contents:"
            Get-ChildItem "dist/win-unpacked/resources" | Format-Table Name, Length
            
            echo "`n=== Checking for app-frontend in resources (extraResources location) ==="
            if (Test-Path "dist/win-unpacked/resources/app-frontend") {
              echo "✓ app-frontend found in resources directory!"
              $fileCount = (Get-ChildItem "dist/win-unpacked/resources/app-frontend" -Recurse -File).Count
              echo "Total files in app-frontend: $fileCount"
              Get-ChildItem "dist/win-unpacked/resources/app-frontend" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
            } else {
              echo "✗ app-frontend NOT found in resources directory!"
            }
            
            echo "`n=== Checking app.asar ==="
            if (Test-Path "dist/win-unpacked/resources/app.asar") {
              echo "✓ app.asar found"
            }
            
            echo "`n=== Checking app.asar.unpacked ==="
            if (Test-Path "dist/win-unpacked/resources/app.asar.unpacked") {
              echo "app.asar.unpacked contents:"
              Get-ChildItem "dist/win-unpacked/resources/app.asar.unpacked" | Format-Table Name
            } else {
              echo "app.asar.unpacked does not exist (not needed with extraResources)"
            }
          } else {
            echo "win-unpacked directory not found"
          }
        shell: pwsh

      - name: Verify Token
        run: |
          if (-not $env:RELEASE_TOKEN) { Write-Error "RELEASES_REPO_TOKEN is missing"; exit 1 }
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        shell: pwsh

      - name: Upload to public releases repo
        if: matrix.os == 'windows-latest' && success()
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          repository: chatbotde/buddy-releases
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: dist/*.exe
          fail_on_unmatched_files: true
          draft: false
          make_latest: true
          generate_release_notes: true
          target_commitish: main
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
