name: Build and Release

on:
  push:
    branches:
      - deploy
    tags:
      - 'v*'
  pull_request:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  # Windows builds - x64 only
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable hosted auth (official SonicThinking releases only)
        if: github.repository == 'sonicthinking/buddy'
        run: printf '%s\n' '{"hostedAuth":true,"authServerUrl":"https://www.sonicthinking.com"}' > auth/build-config.json
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (buddy)
        run: npm ci --legacy-peer-deps

      - name: Install dependencies (frontend)
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Build interface window
        run: |
          cd interface-window
          npm ci --legacy-peer-deps
          npm run build

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build all
        run: npm run build:all

      - name: Build and Publish Electron app (Windows - x64)
        run: npm run dist:win -- --publish always
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GEMINI_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DATABASE_URL: ""
          BETTER_AUTH_SECRET: ""
          BETTER_AUTH_URL: ""

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonicthinking-windows-x64
          path: dist/*.exe
          retention-days: 30

  # macOS builds - Universal only
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable hosted auth (official SonicThinking releases only)
        if: github.repository == 'sonicthinking/buddy'
        run: printf '%s\n' '{"hostedAuth":true,"authServerUrl":"https://www.sonicthinking.com"}' > auth/build-config.json
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (buddy)
        run: npm ci --legacy-peer-deps

      - name: Install dependencies (frontend)
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Build interface window
        run: |
          cd interface-window
          npm ci --legacy-peer-deps
          npm run build

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build all
        run: npm run build:all

      - name: Build and Publish Electron app (macOS - Universal)
        run: npm run dist:mac -- --publish always
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GEMINI_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          DATABASE_URL: ""
          BETTER_AUTH_SECRET: ""
          BETTER_AUTH_URL: ""

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonicthinking-macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30

  # Linux builds - x64 only
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable hosted auth (official SonicThinking releases only)
        if: github.repository == 'sonicthinking/buddy'
        run: printf '%s\n' '{"hostedAuth":true,"authServerUrl":"https://www.sonicthinking.com"}' > auth/build-config.json
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (buddy)
        run: npm ci --legacy-peer-deps

      - name: Install dependencies (frontend)
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Build interface window
        run: |
          cd interface-window
          npm ci --legacy-peer-deps
          npm run build

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build all
        run: npm run build:all

      - name: Build and Publish Electron app (Linux - x64)
        run: npm run dist:linux -- --publish always
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GEMINI_API_KEY: ""
          OPENAI_API_KEY: ""
