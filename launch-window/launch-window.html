<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddy Launcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px 0 0 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        body:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            transform: translateX(-10px);
            box-shadow: -8px 0 20px rgba(0, 0, 0, 0.4);
        }

        .launcher-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 10px;
        }

        .launcher-icon {
            font-size: 24px;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        .launcher-text {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        .launcher-hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            opacity: 0.7;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Glow effect */
        body::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 15px 0 0 15px;
            z-index: -1;
            filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body:hover::before {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="launcher-content">
        <div class="launcher-icon">🚀</div>
        <div class="launcher-text">Buddy</div>
        <div class="launcher-hint">Click</div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        
        // Handle click to open main window
        document.addEventListener('click', () => {
            ipcRenderer.send('open-main-window');
        });

        // Add some interactive feedback
        document.addEventListener('mouseenter', () => {
            document.body.style.transform = 'translateX(-15px)';
        });

        document.addEventListener('mouseleave', () => {
            document.body.style.transform = 'translateX(0)';
        });
    </script>
</body>
</html>
