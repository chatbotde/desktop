<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: none;
            /* Minimal backdrop filter */
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            position: absolute;
            left: 0;

            overflow: hidden;
            /* Adding rounded corners */
            border: none;
            border-radius: 15px 0 0 15px; /* Round only left corners */
            color: white;
            
            font-family: system-ui, -apple-system, sans-serif;
            padding-right: 5px;
        }

        /* Simplified hover - no animations */
        body:hover {
            background:none;
            /* No expansion or complex effects */
        }

        /* Inactive state - minimal resource usage */
        body.inactive {
            background:none;
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0.7;
            /* No scaling or transitions */
        }

        /* Active state */
        body.active {
            background:none;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            opacity: 1;
            /* No scaling or transitions */
        }

        

        
    </style>
</head>

<body>
    <script>
        // Activate window on hover
        document.body.addEventListener('mouseenter', () => {
            console.log('Launch window: Mouse entered, setting active state');
            if (window.launchWindowAPI && window.launchWindowAPI.setActiveState) {
                window.launchWindowAPI.setActiveState();
            }
        });
    </script>
</body>
</html>
